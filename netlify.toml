# Netlify publishes the folder the workflows write into.
# There is nothing to build: the page is already a finished HTML file.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The page itself rarely changes, but it must be revalidated so a new
# build is picked up straight away rather than after a cache expires.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The data is rewritten every hour, so it must never be served stale.
[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

/* players -------------------------------------------------------------
   About a third of players have privacy mode on, so every table here is
   of players with public stats rather than of the game. Say so.         */
const PLAYERS = DATA.players || [];
const PUBLIC = PLAYERS.filter(p => !p.private);
const SKILLS = (DATA.skills || []).slice().sort((a, b) =>
  a === "Overall" ? -1 : b === "Overall" ? 1 : a.localeCompare(b));
/* Composite rankings. The official page has these and they are the ones
   people argue about. Combat and non-combat are split the way the game
   groups them; say so, since it is a judgement call at the edges.      */
const COMBAT = ["Attack", "Defense", "Defence", "Ranging", "Summoning",
                "Magic"];
const NONCOMBAT = ["Harvest", "Harvesting", "Alchemy", "Potion",
                   "Manufacture", "Manufacturing", "Crafting",
                   "Engineering", "Tailoring"];
const realSkills = p => Object.entries(p.stats)
  .filter(([n, v]) => v.k === "skill" && n !== "Overall");

const COMPOSITES = {
  "Combat total": {
    note: "Attack, Defense, Ranging, Summoning and Magic added together",
    of: p => {
      const v = realSkills(p).filter(([n]) => COMBAT.includes(n));
      return v.length ? v.reduce((t, [, x]) => t + x.v, 0) : null;
    },
  },
  "Non-combat total": {
    note: "the gathering and making skills added together",
    of: p => {
      const v = realSkills(p).filter(([n]) => NONCOMBAT.includes(n));
      return v.length ? v.reduce((t, [, x]) => t + x.v, 0) : null;
    },
  },
  "All skills total": {
    note: "every skill added together, Overall excluded",
    of: p => {
      const v = realSkills(p);
      return v.length ? v.reduce((t, [, x]) => t + x.v, 0) : null;
    },
  },
  "Jack of all trades": {
    note: "your lowest skill - rewards being well rounded rather than "
        + "specialised",
    of: p => {
      const v = realSkills(p);
      return v.length ? Math.min(...v.map(([, x]) => x.v)) : null;
    },
  },
};
const COMPOSITE_NAMES = Object.keys(COMPOSITES);

function statOf(p, key) {
  if (COMPOSITES[key]) return COMPOSITES[key].of(p);
  return p.stats[key] ? p.stats[key].v : null;
}

const pickEl = document.getElementById("skillpick");
if (pickEl && SKILLS.length) {
  pickEl.innerHTML = `<option value="">Every skill</option>`
    + `<optgroup label="Skill">`
    + SKILLS.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("")
    + `</optgroup><optgroup label="Combined">`
    + COMPOSITE_NAMES.map(s =>
        `<option value="${esc(s)}">${esc(s)}</option>`).join("")
    + `</optgroup>`;
  pickEl.value = pskill;
  pickEl.onchange = () => { pskill = pickEl.value; render(); };
}
document.querySelectorAll("#viewwrap button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#viewwrap button").forEach(x =>
    x.classList.remove("on"));
  b.classList.add("on"); pview = b.dataset.pview; focusPlayer = null; render();
});
const playerLink = n =>
  `<a class="lnk" data-player="${esc(n)}">${esc(n)}</a>`;
const wirePlayerLinks = () =>
  document.querySelectorAll("a.lnk[data-player]").forEach(a =>
    a.onclick = e => { e.stopPropagation(); go("players", a.dataset.player); });

const caveat = `<div class="caveat">${
  DATA.meta.playerCount} players with public stats. ${
  DATA.meta.privateCount} have privacy mode on, so they are not shown
  here \u2014 any of them could be top of this table.</div>`;

// The leaderboard runs to several hundred names, so it opens short.
let summonersShown = 25;

/* guilds --------------------------------------------------------------
   Who is in which guild is published nowhere, so this comes from
   guild.txt, kept by hand. A guild page is the same rankings as the
   players tab, narrowed to one roster, which is the only way to see
   where someone stands among the people they actually play with.    */

const guildBy = tag => (DATA.guilds || []).find(g =>
  g.tag.toLowerCase() === String(tag || "").toLowerCase());

// A roster is a list of names; the stats live with the players.
function guildMembers(g) {
  const want = new Map((g.members || []).map(n => [n.toLowerCase(), n]));
  const found = PLAYERS.filter(p => want.has(p.name.toLowerCase()));
  const seen = new Set(found.map(p => p.name.toLowerCase()));
  const missing = [...want.entries()].filter(([k]) => !seen.has(k))
                                     .map(([, n]) => n);
  return { found, missing };
}

function renderGuilds(view, count) {
  const gs = DATA.guilds || [];
  count.textContent = `${gs.length} guild${gs.length === 1 ? "" : "s"}`;
  if (!gs.length) {
    view.innerHTML = `<div class="empty">No guild is being followed yet.
      <br><span class="sm">Add one to <code>guild.txt</code>.</span></div>`;
    return;
  }
  view.innerHTML = `
    <div class="grouphint">Guild membership is not published anywhere we
      could find, so these rosters are kept by hand. To have a guild
      added, send its member list.</div>
    <table class="daylog"><thead><tr><th>Guild</th><th>Tag</th>
      <th class="stonecell">Members</th>
      <th class="stonecell">With stats</th></tr></thead>
    <tbody>${gs.map(g => {
      const { found } = guildMembers(g);
      const open = found.filter(p => !p.private).length;
      return `<tr>
        <td><a class="lnk glnk" href="#guilds/${encodeURIComponent(g.tag)}">${
          esc(g.name)}</a></td>
        <td class="sm">${esc(g.tag)}</td>
        <td class="num">${fmt(g.members.length)}</td>
        <td class="num sm">${fmt(open)}</td></tr>`;
    }).join("")}</tbody></table>`;
}

function renderOneGuild(view, count, q) {
  const g = guildBy(focusGuild);
  if (!g) { count.textContent = ""; 
    view.innerHTML = `<div class="empty">No such guild.</div>`; return; }

  const { found, missing } = guildMembers(g);
  const open = found.filter(p => !p.private);
  const hidden = found.length - open.length;

  // Ranked by the chosen skill, or by overall when none is chosen.
  const key = gskill || "Overall";
  let rows = open
    .map(p => ({ p, lvl: statOf(p, key) }))
    .filter(x => x.lvl != null)
    .filter(x => !q || x.p.name.toLowerCase().includes(q))
    .sort((a, b) => b.lvl - a.lvl || a.p.name.localeCompare(b.p.name));

  count.textContent = `${esc(g.name)}, ${fmt(g.members.length)} members`;

  const picker = `<div class="pills">
    <button class="pill${gskill ? "" : " on"}" data-gskill="">Overall</button>
    ${SKILLS.filter(sk => sk !== "Overall").map(sk =>
      `<button class="pill${gskill === sk ? " on" : ""}"
        data-gskill="${esc(sk)}">${esc(sk)}</button>`).join("")}</div>`;

  // The guild's own total, which is the number a guild actually argues
  // about. Private members are not in it, so it is a floor.
  const total = open.reduce((a, p) => a + (statOf(p, key) || 0), 0);
  const best = rows[0];

  let rank = 0, last = null;
  view.innerHTML = `
    <div class="bothead">
      <button class="back">All guilds</button>
      <h2>${esc(g.name)}</h2>
      <span class="where">${esc(g.tag)}</span>
    </div>
    ${picker}
    <div class="grouphint">${fmt(open.length)} of ${fmt(g.members.length)}
      members have public stats${hidden ? `, ${fmt(hidden)} have privacy
      mode on` : ""}${missing.length ? `, ${fmt(missing.length)} have not
      been read yet` : ""}. Between them they hold
      <b>${fmt(total)}</b> ${esc(key.toLowerCase())}${best
        ? `, and ${playerLink(best.p.name)} leads on ${fmt(best.lvl)}` : ""}.
      Private members are left out, so that total is a floor.</div>
    ${rows.length ? `<div class="scroller"><table>
      <thead><tr><th class="num">#</th><th>Player</th>
        <th class="num">${esc(key)}</th>
        ${gskill ? `<th class="num hide-sm">Overall</th>` : ""}</tr></thead>
      <tbody>${rows.map(x => {
        if (x.lvl !== last) { rank = rows.indexOf(x) + 1; last = x.lvl; }
        return `<tr>
          <td class="num sm">${rank}</td>
          <td>${playerLink(x.p.name)}</td>
          <td class="num brass">${fmt(x.lvl)}</td>
          ${gskill ? `<td class="num sm hide-sm">${
            fmt(statOf(x.p, "Overall") || 0)}</td>` : ""}
        </tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty">Nobody in this guild has a public ${
          esc(key.toLowerCase())}.</div>`}
    ${missing.length ? `<div class="caveat">Not read yet: ${
      missing.slice(0, 12).map(esc).join(", ")}${
      missing.length > 12 ? ` and ${fmt(missing.length - 12)} more` : ""}.
      They are picked up on the next daily read.</div>` : ""}`;

  wirePlayerLinks();
  const back = view.querySelector(".back");
  if (back) back.onclick = () => go("guilds");
  view.querySelectorAll("[data-gskill]").forEach(b => b.onclick = () => {
    gskill = b.dataset.gskill; render();
  });
}

/* events --------------------------------------------------------------
   Mercator relays what the game broadcasts to everyone. Pears and jokers
   are found by players; invasions happen to places. The same column
   carries both, because that is how the broadcasts are written.       */

function renderEvents(view, count, q) {
  const t = DATA.eventTotals;
  const all = DATA.finders || [];

  // Five ways of being first at something. Each board is the same shape
  // - a name, a number, and when they started and last managed it - so
  // switching between them does not rearrange the page.
  const BOARDS = {
    found:  { label: "Most found", unit: "Found", who: "finders",
              hint: "Pears and jokers together.",
              rows: all, value: f => f.n,
              first: f => f.first, last: f => f.last },
    pears:  { label: "Most pears", unit: "Pears", who: "have found one",
              hint: "Pears alone.",
              rows: all.filter(f => f.pears), value: f => f.pears,
              first: f => f.pearFirst, last: f => f.pearLast },
    jokers: { label: "Most jokers", unit: "Jokers", who: "have found one",
              hint: "Jokers alone. Some players have found hundreds of "
                    + "these and never a single pear.",
              rows: all.filter(f => f.jokers), value: f => f.jokers,
              first: f => f.jokerFirst, last: f => f.jokerLast },
    gold:   { label: "Most generous", unit: "Gold given", who: "donors",
              hint: "Gold given to keep the project running.",
              rows: DATA.donors || [], value: d => d.gold,
              first: d => d.first, last: d => d.last },
    said:   { label: "Most broadcasts", unit: "Broadcasts", who: "speakers",
              hint: "Whose name the game's own announcements come from.",
              rows: DATA.speakers || [], value: m => m.n,
              first: m => m.first, last: m => m.last },
  };
  const board = BOARDS[eboard] || BOARDS.found;
  const ranked = [...board.rows].sort((a, b) => board.value(b) - board.value(a));
  const place = new Map(ranked.map((r, i) => [r.name, i + 1]));
  const hits = q ? ranked.filter(r => r.name.toLowerCase().includes(q)) : ranked;
  const shown = hits.slice(0, findersShown);

  count.textContent = t
    ? `${fmt(t.all)} broadcasts, ${fmt(ranked.length)} ${board.who}` : "";

  const k = (t && t.kinds) || {};
  const headline = !t ? "" : `
    <div class="grouphint">Everything the game has shouted at everyone
      since ${esc(t.since)}: ${fmt(k.pear || 0)} pears and ${
      fmt(k.joker || 0)} jokers found, ${fmt(k.invasion || 0)} invasion
      warnings, ${fmt(k.treasure || 0)} treasures and ${
      fmt(k.donation || 0)} donations worth ${fmt(t.donated)} gold.
      ${fmt(t.all - t.read)} broadcasts are worded in ways we cannot read
      yet and are left out of the counts.</div>`;

  const picker = `<div class="pills">${Object.entries(BOARDS).map(
    ([key, b]) => `<button class="pill${eboard === key ? " on" : ""}"
      data-board="${key}">${esc(b.label)}</button>`).join("")}</div>`;

  const finders = !ranked.length ? "" : `
    ${picker}
    ${headline}
    <h2 class="group">${esc(board.label)}</h2>
    <div class="grouphint">${esc(board.hint)}</div>
    <table class="daylog sortable finders"><thead><tr><th>Player</th>
      <th class="stonecell">${esc(board.unit)}</th>
      ${eboard === "found" ? `<th class="stonecell">Pears</th>
        <th class="stonecell">Jokers</th>` : ""}
      ${eboard === "gold" ? `<th class="stonecell">Gifts</th>` : ""}
      <th>First</th><th>Last</th></tr></thead>
    <tbody>${shown.map(r => {
      const pos = place.get(r.name);
      return `<tr>
        <td class="nowrap"><span class="rank${pos <= 3 ? " medal" : ""}">${
          pos}</span>${playerLink(r.name)}</td>
        <td class="num brass">${fmt(board.value(r))}</td>
        ${eboard === "found" ? `<td class="num sm">${
            r.pears ? fmt(r.pears) : ""}</td>
          <td class="num sm">${r.jokers ? fmt(r.jokers) : ""}</td>` : ""}
        ${eboard === "gold" ? `<td class="num sm">${fmt(r.n)}</td>` : ""}
        <td class="sm">${esc(board.first(r))}</td>
        <td class="sm">${esc(board.last(r))}</td></tr>`; }).join("")}</tbody></table>
    ${hits.length > shown.length ? `<button class="more" id="morefinders">
      Show the other ${fmt(hits.length - shown.length)}</button>` : ""}
    ${hits.length ? "" : `<div class="caveat">Nobody by that name is on
      this board.</div>`}`;

  const inv = (DATA.invasions || []).slice(0, 12);
  const invMax = Math.max(...inv.map(i => i.n), 1);
  const places = (!inv.length || q) ? "" : `
    <h2 class="group">Where the invasions land</h2>
    <div class="grouphint">Warnings the invasion system has sent for each
      place. One invasion sends several, so read these against each other
      rather than as a count of invasions.</div>
    <table class="ranks">${inv.map(i => `<tr>
      <td>${esc(i.place)}</td>
      <td class="barcell"><span class="bar"><i style="width:${
        Math.max(2, Math.round(100 * i.n / invMax))}%"></i></span></td>
      <td class="num">${fmt(i.n)}</td></tr>`).join("")}</table>`;

  const log = (DATA.eventLog || []).filter(e =>
    !q || (e.message || "").toLowerCase().includes(q));
  const recent = !log.length ? "" : `
    <h2 class="group">Lately</h2>
    <table class="daylog"><tbody>${log.slice(0, 30).map(e => `<tr>
      <td class="sm nowrap">${esc(e.at)}</td>
      <td class="sm"><span class="evkind">${esc(e.what)}</span></td>
      <td class="sm">${esc(e.message)}</td></tr>`).join("")}</tbody></table>`;

  view.innerHTML = finders + places + recent
    + (finders || recent ? "" : `<div class="empty">Nothing matches that.</div>`);
  wirePlayerLinks();
  const more = document.getElementById("morefinders");
  if (more) more.onclick = () => { findersShown += 200; render(); };
  view.querySelectorAll("[data-board]").forEach(b => b.onclick = () => {
    eboard = b.dataset.board; findersShown = 25; render();
  });
}

/* quests --------------------------------------------------------------
   Parsed out of the community quest guide by el_quests.py. The guide is
   a player's work, so the write-ups are shown as written.              */

const questBy = name => (DATA.quests || []).find(x =>
  x.name.toLowerCase() === String(name || "").toLowerCase());

const questLink = name =>
  `<a class="lnk qlnk" href="#quests/${encodeURIComponent(name)}">${
    esc(name)}</a>`;

// What a quest pays, in one line: "75,000 Attack · 75,000 Defense".
function questPay(qu) {
  const paid = (qu.reward || []).filter(r => r.amount);
  // The guide's own cross-reference does not say reliably which skill a
  // daily pays, so a daily says only that it varies.
  if (!paid.length) {
    return qu.varies ? `<span class="muted">varies with your level</span>` : "";
  }
  return paid.slice(0, 3).map(r => `${esc(r.amount)} ${esc(r.what)}`)
    .join(" \u00b7 ") + (paid.length > 3 ? " \u2026" : "");
}

function questMatches(qu, q) {
  if (!q) return true;
  const hay = [qu.name, qu.npc, qu.where, qu.section,
               (qu.items || []).join(" "),
               (qu.reward || []).map(r => r.what).join(" "),
               (qu.requirements || []).join(" ")].join(" ").toLowerCase();
  return hay.includes(q);
}

function renderQuests(view, count, q) {
  const all = DATA.quests || [];
  const secs = DATA.questSections || [];
  let list = all.filter(qu => questMatches(qu, q));
  if (qsection) list = list.filter(qu => qu.section === qsection);

  count.textContent = `${fmt(list.length)} quest${list.length === 1 ? "" : "s"}`
    + (qsection ? ` in ${qsection.toLowerCase()}` : "");

  const picker = `<div class="pills">
    <button class="pill${qsection ? "" : " on"}" data-qsec="">Everything</button>
    ${secs.map(sec => `<button class="pill${qsection === sec ? " on" : ""}"
      data-qsec="${esc(sec)}">${esc(sec.replace(/ Quests$/, ""))}</button>`)
      .join("")}</div>`;

  const rows = list.map(qu => `<tr>
    <td>${questLink(qu.name)}${qu.status
      ? ` <span class="unsure">${esc(qu.status)}</span>` : ""}
      <div class="seen">${esc(qu.section.replace(/ Quests$/, ""))}</div></td>
    <td class="sm">${qu.npc
      ? `${esc(qu.npc)}${qu.where ? `<div class="seen">${esc(qu.where)}${
          qu.at ? ` [${qu.at[0]},${qu.at[1]}]` : ""}</div>` : ""}`
      : ""}</td>
    <td class="sm brass">${questPay(qu)}</td>
    <td class="num sm">${qu.steps && qu.steps.length
      ? `${qu.steps.length} step${qu.steps.length === 1 ? "" : "s"}` : ""}</td>
  </tr>`).join("");

  view.innerHTML = picker + (list.length ? `
    <table class="daylog quests"><thead><tr><th>Quest</th><th>Starts with</th>
      <th>Pays</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">No quest matches that.</div>`);

  view.querySelectorAll("[data-qsec]").forEach(b => b.onclick = () => {
    qsection = b.dataset.qsec; render();
  });
}

function renderOneQuest(view, count) {
  const qu = questBy(focusQuest);
  count.textContent = "";
  if (!qu) { view.innerHTML = `<div class="empty">No such quest.</div>`; return; }

  // The guide lays its tables out with spaces. Folding those into prose
  // would destroy them, so anything that looks like a table is left
  // exactly as the guide set it.
  const lines = qu.noteLines || [];
  const tabular = lines.filter(l => /\S {2,}\S/.test(l)).length >= 3;
  const notes = !lines.length ? "" : (tabular
    ? `<pre class="guide">${esc(lines.join("\n"))}</pre>`
    : (qu.notes || []).map(p => `<p>${esc(p)}</p>`).join(""));

  const block = (title, html) => html
    ? `<div class="qblock"><h3>${title}</h3>${html}</div>` : "";

  // A daily has no reward list and nothing to bring, so the side column
  // would be an empty third of the page. Then the steps get the width.
  const twoCol = (qu.reward || []).length || (qu.items || []).length
                 || (qu.requirements || []).length;

  const steps = (qu.steps || []).map(st => `<li>${esc(st.text)}${
    st.sub && st.sub.length ? `<ol class="sub">${st.sub.map(sb =>
      `<li>${esc(sb.text)}</li>`).join("")}</ol>` : ""}</li>`).join("");

  const right = block("Steps", steps ? `<ol class="steps">${steps}</ol>` : "")
              + block("Notes", notes);

  view.innerHTML = `
    <div class="bothead">
      <button class="back">All quests</button>
      <h2>${esc(qu.name)}</h2>
      <span class="where">${esc(qu.section)}${qu.status
        ? ` \u00b7 ${esc(qu.status)}` : ""}</span>
    </div>
    ${qu.npc ? `<div class="qnpc">Start with <b>${esc(qu.npc)}</b>${
      qu.where ? ` at ${esc(qu.where)}` : ""}${
      qu.at ? ` <span class="coord">[${qu.at[0]},${qu.at[1]}]</span>` : ""}
      </div>` : ""}
    ${(qu.intro || []).map(p => `<p class="qintro">${esc(p)}</p>`).join("")}
    ${twoCol ? `<div class="cols">
      <div>
        ${block("Pays", (qu.reward || []).length
          ? `<table>${qu.reward.map(r => `<tr><td>${esc(r.what)}</td>
             <td class="num brass">${r.amount ? esc(r.amount) : ""}</td></tr>`)
             .join("")}</table>` : "")}
        ${block("You will need", (qu.items || []).length
          ? `<ul class="plain">${qu.items.map(i => `<li>${esc(i)}</li>`)
             .join("")}</ul>` : "")}
        ${block("First", (qu.requirements || []).length
          ? `<ul class="plain">${qu.requirements.map(i => `<li>${esc(i)}</li>`)
             .join("")}</ul>` : "")}
      </div>
      <div style="flex: 2 1 480px">${right}</div>
    </div>` : right}
    <div class="caveat">Written up by the Eternal Lands community in the
      quest guide, and shown here as written.</div>`;

  const back = view.querySelector(".back");
  if (back) back.onclick = () => go("quests");
}

function renderDays(view, count, q) {
  const ref = DATA.dayRef || {};
  const log = DATA.days || [];
  const match = (name, what) => !q
    || name.toLowerCase().includes(q)
    || (what || "").toLowerCase().includes(q);

  const groups = [["good", "Days worth being online for"],
                  ["bad", "Days to sit out"],
                  ["mixed", "Depends what you are doing"],
                  ["ordinary", "Nothing doing"]];
  const seenCount = {};
  for (const d of log) seenCount[d.special] = (seenCount[d.special] || 0) + 1;

  const reference = groups.map(([kind, title]) => {
    const rows = Object.entries(ref)
      .filter(([name, v]) => v.kind === kind && match(name, v.what));
    if (!rows.length) return "";
    // Every bad day is cleared by the same stone, so that price is said
    // once above the table rather than nine times down a column.
    const removal = rows.map(([, v]) => v.removalPrice).find(Boolean);
    const note = kind === "bad" && removal
      ? `<div class="grouphint">Any of these can be cut short with a
         <b>Bad Day Removal</b> \u2014 ${fmt(removal.price)} at ${
         botLink(removal.bot)}.</div>` : "";
    const summonable = kind !== "bad";
    return `<h2 class="group">${title}</h2>${note}
      <table class="daylog"><thead><tr><th>Day</th><th>What it does</th>
        ${summonable ? `<th class="stonecell">Stone to start it</th>` : ""}
      </tr></thead>
      <tbody>${rows.map(([name, v]) => `<tr>
        <td><span class="daydot k-${esc(kind)}"></span>${esc(name)}
          ${seenLine(v)}</td>
        <td class="sm">${esc(v.what || "")}</td>
        ${summonable ? `<td class="stonecell">${stoneLine(v)}</td>` : ""}
      </tr>`).join("")}</tbody></table>`;
  }).join("");

  // Fifteen years of records, read three ways: which days come round
  // most, which ones players reach into their pockets for, and whether
  // the game has been getting busier or quieter.
  const R = DATA.dayRanks;
  const bar = (v, max) => `<span class="bar"><i style="width:${
    Math.max(2, Math.round(100 * v / (max || 1)))}%"></i></span>`;
  const rankPanel = (title, hint, rows, key) => {
    const max = Math.max(...rows.map(r => r[key]));
    return `<div><h3>${title}</h3>
      <div class="panelhint">${hint}</div>
      <table class="ranks">${rows.map(r => `<tr>
        <td>${esc(r.name)}</td>
        <td class="barcell">${bar(r[key], max)}</td>
        <td class="num">${fmt(r[key])}</td>
      </tr>`).join("")}</table></div>`;
  };
  // The number of days a year barely moves - the game sends roughly the
  // same number every year. What moves is how many players paid for, so
  // that is what the chart shows.
  const years = (R && R.years || []).slice(-10);
  const yearMax = Math.max(...years.map(y => y.paid), 1);
  const statsPanel = (!R || q) ? "" : `
    <h2 class="group">Fifteen years of days</h2>
    <div class="cols">
      ${rankPanel("Comes round most", "Times recorded since 2011",
                  R.common, "n")}
      ${rankPanel("Players pay for most", "Times someone put the stone down",
                  R.paid, "paid")}
    </div>
    ${years.length > 2 ? `<div class="years">
      <h3>Days players paid for, by year</h3>
      <div class="panelhint">The game sends roughly ${
        fmt(Math.round(years.reduce((a, y) => a + y.n, 0) / years.length))
        } days a year whatever happens, so this is the part that moves.</div>
      <div class="yearbars">${years.map(y => {
        const partial = Number(y.y) === new Date().getFullYear();
        return `<div class="yb${partial ? " partial" : ""}" title="${
          esc(y.y)}: ${fmt(y.paid)} of ${fmt(y.n)} paid for${
          partial ? ", year not finished" : ""}">
          <b>${fmt(y.paid)}</b>
          <div class="ybstack" style="height:${
            Math.round(100 * y.paid / yearMax)}%"></div>
          <span>${esc(y.y)}${partial ? "*" : ""}</span>
        </div>`; }).join("")}</div>
      ${years.some(y => Number(y.y) === new Date().getFullYear())
        ? `<div class="panelhint" style="margin-top:8px">* this year is
           not over yet.</div>` : ""}</div>` : ""}`;

  const mlog = (DATA.dayLog || []).filter(d => match(d.name, ""));
  const logTable = mlog.length ? `
    <h2 class="group">What has actually been running</h2>
    <table class="daylog"><thead><tr><th>When</th><th>Day</th>
      <th>Game date</th><th>Started by</th></tr></thead>
    <tbody>${mlog.map(d => `<tr>
        <td class="sm">${esc(d.at)}</td>
        <td><span class="daydot k-${esc(kindOf(d.name))}"></span>${
          esc(d.name)}</td>
        <td class="sm">${esc(d.when || "")}${
          d.clock ? ` <span class="muted">${esc(d.clock)}</span>` : ""}</td>
        <td class="sm">${d.by
          ? `<span class="brass">${esc(d.by)}</span>`
          : `came round on its own`}</td>
      </tr>`).join("")}</tbody></table>` : "";

  // Everyone who has ever paid for a day, ranked. Positions are worked
  // out from the whole list so a search does not renumber it.
  const all = DATA.summoners || [];
  const place = new Map(all.map((p, i) => [p.name, i + 1]));
  const hits = q ? all.filter(p =>
    p.name.toLowerCase().includes(q)
    || (p.fav || "").toLowerCase().includes(q)) : all;
  const shown = hits.slice(0, summonersShown);
  const t = DATA.dayTotals;

  const summonerTable = !all.length ? "" : `
    <h2 class="group">Who starts the days</h2>
    ${t ? `<div class="grouphint">Of ${fmt(t.all)} days since ${esc(t.since)},
      <b>${fmt(t.paid)}</b> were started by a player putting a stone down
      rather than the game coming round to them. ${fmt(t.players)} people
      have done it${t.centurions === 1
        ? `, and one has passed a hundred` : ""}.</div>` : ""}
    <table class="daylog sortable"><thead><tr>
      <th>Player</th>
      <th class="stonecell" data-sort="n">Days started</th>
      <th>Reaches for</th>
      <th>First</th><th>Last</th></tr></thead>
    <tbody>${shown.map(p => {
      const pos = place.get(p.name);
      return `<tr>
      <td><span class="rank${pos <= 3 ? " medal" : ""}">${pos}</span>${
        playerLink(p.name)}</td>
      <td class="num brass">${fmt(p.n)}</td>
      <td class="sm">${p.fav ? `${esc(p.fav)} <span class="muted">\u00d7${
        fmt(p.favN)}</span>` : ""}</td>
      <td class="sm">${esc(p.first || "")}</td>
      <td class="sm">${esc(p.last || "")}</td>
    </tr>`; }).join("")}</tbody></table>
    ${hits.length > shown.length ? `<button class="more" id="moresummoners">
      Show the other ${fmt(hits.length - shown.length)}</button>` : ""}
    ${hits.length ? "" : `<div class="caveat">Nobody by that name has
      started a day.</div>`}`;

  const buyable = Object.values(ref).filter(v => v.stonePrice).length;
  count.textContent = `${Object.keys(ref).length} special days, `
    + `${buyable} you can summon yourself`;
  view.innerHTML = todayBanner() + statsPanel + logTable + reference
    + summonerTable
    + (reference || logTable || summonerTable ? ""
       : `<div class="empty">Nothing matches that.</div>`);
  wireBotLinks(); wirePlayerLinks(); startClock();
  const more = document.getElementById("moresummoners");
  if (more) more.onclick = () => { summonersShown += 200; render(); };
}

function renderPlayers(view, count, q) {
  if (!PLAYERS.length) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">No player data yet.<br>
      <span class="sm">Run <code>python el_players.py seed</code> then
      <code>scrape</code>, and rebuild.</span></div>`;
    return;
  }
  if (focusPlayer) return renderOnePlayer(view, count);
  if (pview === "pk") return renderPk(view, count, q);
  if (pview === "movers") return renderMovers(view, count, q);
  if (pview === "online") return renderOnline(view, count, q);
  if (!pskill) return renderAllSkills(view, count, q);

  const rows = PUBLIC
    .filter(p => !q || p.name.toLowerCase().includes(q))
    .map(p => ({ p, lvl: statOf(p, pskill) }))
    .filter(x => x.lvl != null)
    .sort((a, b) => b.lvl - a.lvl || a.p.name.localeCompare(b.p.name));
  if (!rows.length) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">Nothing matches that.</div>`;
    return;
  }
  count.textContent = `${rows.length} players ranked by ${pskill}`;
  const note = COMPOSITES[pskill]
    ? `<div class="caveat" style="margin-bottom:4px">${pskill}:
       ${COMPOSITES[pskill].note}.</div>` : "";
  let rank = 0, last = null;
  view.innerHTML = note + caveat + `<div class="scroller"><table>
    <thead><tr><th class="num">#</th><th>Player</th>
    <th class="num">${esc(pskill)}</th><th class="num hide-sm">Overall</th>
    <th class="hide-sm">Best at</th></tr></thead><tbody>
    ${rows.map(({ p, lvl }, i) => {
      if (lvl !== last) { rank = i + 1; last = lvl; }
      const best = Object.entries(p.stats)
        .filter(([s, v]) => v.k === "skill" && s !== "Overall")
        .sort((a, b) => b[1].v - a[1].v)[0];
      return `<tr>
        <td class="num rank">${rank}</td>
        <td>${playerLink(p.name)}</td>
        <td class="num brass">${lvl}</td>
        <td class="num sm hide-sm">${p.overall ?? "\u2013"}</td>
        <td class="sm hide-sm">${best ? esc(best[0]) + " " + best[1].v : ""}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
  wirePlayerLinks();
}

function renderAllSkills(view, count, q) {
  // Every skill at once, the way the official rankings page does it, but
  // with the levels it leaves out. Pick a skill above for the full table.
  const per = 10;
  const build = skill => {
    const rows = PUBLIC
      .filter(p => !q || p.name.toLowerCase().includes(q))
      .map(p => ({ p, v: statOf(p, skill) }))
      .filter(x => x.v != null)
      .sort((a, b) => b.v - a.v || a.p.name.localeCompare(b.p.name))
      .slice(0, per);
    if (!rows.length) return "";
    let rank = 0, last = null;
    return `<div class="skillcol"><h3>${esc(skill)}</h3><table>
      ${rows.map(({ p, v: lvl }, i) => {
        if (lvl !== last) { rank = i + 1; last = lvl; }
        return `<tr><td class="num rank">${rank}</td>
          <td>${playerLink(p.name)}</td>
          <td class="num brass">${lvl}</td></tr>`;
      }).join("")}</table>
      <button class="more" data-skill="${esc(skill)}">Full table</button>
      </div>`;
  };

  const section = (title, names) => {
    const inner = names.map(build).filter(Boolean).join("");
    return inner ? `<h2 class="group">${title}</h2>
      <div class="skillgrid">${inner}</div>` : "";
  };
  const cols = section("Combined", COMPOSITE_NAMES)
             + section("Skill by skill", SKILLS);

  if (!cols) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">Nothing matches that.</div>`;
    return;
  }
  count.textContent = `top ${per} in each of ${SKILLS.length} skills `
    + `and ${COMPOSITE_NAMES.length} combined rankings`;
  view.innerHTML = caveat + cols;
  view.querySelectorAll("button.more").forEach(b => b.onclick = () => {
    pskill = b.dataset.skill;
    document.getElementById("skillpick").value = pskill;
    window.scrollTo({ top: 0 });
    render();
  });
  wirePlayerLinks();
}

function renderPk(view, count, q) {
  const rows = PUBLIC.filter(p => p.pk && p.pk.f > 0)
    .filter(p => !q || p.name.toLowerCase().includes(q))
    .sort((a, b) => b.pk.score - a.pk.score);
  if (!rows.length) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">No PK data yet.</div>`;
    return;
  }
  const anyMovement = rows.some(p => p.pk.wasF != null);
  count.textContent = `${rows.length} players with PK history`;
  view.innerHTML = caveat + `<div class="scroller"><table>
    <thead><tr><th class="num">#</th><th>Player</th><th class="num">Score</th>
    <th class="num">Fights</th><th class="num hide-sm">Won</th>
    <th class="num hide-sm">Lost</th><th class="num">Win rate</th>
    <th class="num">This week</th></tr></thead><tbody>
    ${rows.map((p, i) => {
      const k = p.pk, rate = k.f ? k.w / k.f * 100 : 0;
      const df = k.wasF != null ? k.f - k.wasF : null;
      const dw = k.wasW != null ? k.w - k.wasW : null;
      return `<tr>
        <td class="num rank">${i + 1}</td>
        <td>${playerLink(p.name)}</td>
        <td class="num brass">${k.score.toFixed(2)}</td>
        <td class="num">${k.f.toLocaleString("en-GB")}</td>
        <td class="num sm hide-sm">${k.w.toLocaleString("en-GB")}</td>
        <td class="num sm hide-sm">${k.l.toLocaleString("en-GB")}</td>
        <td class="num ${rate >= 80 ? "patina" : rate < 50 ? "t-sea" : ""}">${
          rate.toFixed(0)}%</td>
        <td class="num ${df ? "patina" : "sm"}">${
          df == null ? "\u2013" : df === 0 ? "\u2013"
          : `+${df} fight${df === 1 ? "" : "s"}${dw ? `, ${dw} won` : ""}`}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`
    + (anyMovement ? "" : `<div class="caveat" style="margin-top:14px">
       Weekly movement appears once there are readings from two different
       days.</div>`);
  wirePlayerLinks();
}

function renderMovers(view, count, q) {
  const rows = (DATA.movers || [])
    .filter(m => !q || m.name.toLowerCase().includes(q)
                    || m.stat.toLowerCase().includes(q));
  if (!rows.length) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">No level-ups recorded yet.<br>
      <span class="sm">The first appear once players have been read on two
      different days.</span></div>`;
    return;
  }
  count.textContent = `${rows.length} level-ups`;
  view.innerHTML = caveat + `<div class="scroller"><table>
    <thead><tr><th>When</th><th>Player</th><th>Skill</th>
    <th class="num">Level</th><th class="num hide-sm">Gained</th>
    </tr></thead><tbody>
    ${rows.map(m => `<tr>
      <td class="sm">${esc(m.at)}</td>
      <td>${playerLink(m.name)}</td>
      <td>${esc(m.stat)}</td>
      <td class="num brass">${m.now}</td>
      <td class="num sm hide-sm">${m.was != null
        ? "+" + (m.now - m.was) : "\u2013"}</td></tr>`).join("")}
    </tbody></table></div>`;
  wirePlayerLinks();
}

// Most of the people on the day leaderboard are not among the players we
// follow for stats, so a name there still has to lead somewhere useful.
const summonerFor = name => (DATA.summoners || []).find(x =>
  x.name.toLowerCase() === String(name || "").toLowerCase());

function daysPanel(name) {
  const sm = summonerFor(name);
  const place = (DATA.summoners || []).findIndex(x => x === sm) + 1;
  if (!sm) return "";
  return `<div><h3>Special days</h3><table>
    <tr><td>Days started</td><td class="num brass">${fmt(sm.n)}</td>
      <td class="num sm">#${place}</td></tr>
    ${sm.fav ? `<tr><td>Reaches for</td><td class="sm" colspan="2">${
      esc(sm.fav)} <span class="muted">\u00d7${fmt(sm.favN)}</span></td></tr>`
      : ""}
    <tr><td>First</td><td class="sm" colspan="2">${esc(sm.first)}</td></tr>
    <tr><td>Last</td><td class="sm" colspan="2">${esc(sm.last)}</td></tr>
    </table></div>`;
}

/* who is in the game ---------------------------------------------------
   Read once an hour from the official list. That makes the figure a
   recent reading rather than a live one, which the page says plainly
   rather than implying otherwise.                                     */

function renderOnline(view, count, q) {
  const o = DATA.online;
  if (!o) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">Nobody has been read yet.</div>`;
    return;
  }
  const when = new Date(o.at);
  const mins = Math.max(0, Math.round((Date.now() - when) / 60000));
  const regs = (o.regulars || []).filter(r =>
    !q || r.name.toLowerCase().includes(q));
  count.textContent = `${fmt(o.n)} online, read ${
    mins < 90 ? `${mins} minutes ago` : when.toLocaleString("en-GB")}`;

  const hours = (o.byHour || []).filter(h => h.n);
  const peak = Math.max(...hours.map(h => h.peak), 1);
  const chart = hours.length < 6 ? `
    <div class="caveat">The busiest hours need a day's readings before
      they mean anything. ${fmt(o.readings)} reading${
      o.readings === 1 ? "" : "s"} so far.</div>`
    : `<h2 class="group">When the game is busy</h2>
      <div class="grouphint">Average players online by hour, UTC, across
        ${fmt(o.readings)} readings. The tallest bar is the busiest hour.
        </div>
      <div class="yearbars">${hours.map(h => `
        <div class="yb" title="${h.h}:00 UTC — ${fmt(h.avg)} on average, ${
          fmt(h.peak)} at best, from ${fmt(h.n)} readings">
          <b>${fmt(h.avg)}</b>
          <div class="ybstack" style="height:${
            Math.round(100 * h.avg / peak)}%"></div>
          <span>${String(h.h).padStart(2, "0")}</span>
        </div>`).join("")}</div>`;

  view.innerHTML = `
    <div class="grouphint">At the last reading there were
      <b>${fmt(o.n)}</b> players and ${fmt(o.bots)} bots in the game.
      The list is read once an hour, so this is a recent reading and not
      a live one${o.readings > 1
        ? `; we have seen between ${fmt(o.lo)} and ${fmt(o.hi)} players on`
        : ""}. ${fmt(o.seen)} different players have turned up so far.</div>
    ${chart}
    ${o.readings < 12 ? `
      <h2 class="group">On most often</h2>
      <div class="caveat">This needs a day of readings before it ranks
        anybody: with ${fmt(o.readings)} so far, everyone who has been
        seen is tied. It fills in on its own.</div>` : `
      <h2 class="group">On most often</h2>
      <div class="grouphint">How many of our ${fmt(o.readings)} readings
        each player was in the game for. It measures turning up rather
        than grinding, but it is the closest thing anyone publishes.</div>
      ${regs.length ? `<div class="scroller"><table>
      <thead><tr><th class="num">#</th><th>Player</th>
        <th class="num">Readings</th><th class="hide-sm">Last seen</th>
      </tr></thead><tbody>${regs.slice(0, 200).map((r, i) => `<tr>
        <td class="num sm">${i + 1}</td>
        <td>${playerLink(r.name)}</td>
        <td class="num brass">${fmt(r.n)}</td>
        <td class="sm hide-sm">${esc(r.last)}</td>
        </tr>`).join("")}</tbody></table></div>`
        : `<div class="empty">Nobody by that name has been seen online.
           </div>`}`}`;
  wirePlayerLinks();
}

function renderOnePlayer(view, count) {
  // The game's own capitalisation of a name is not consistent between
  // the stats list and the day log, so "stann" and "StAnN" are one person.
  const want = String(focusPlayer || "").toLowerCase();
  const p = PLAYERS.find(x => x.name === focusPlayer)
         || PLAYERS.find(x => x.name.toLowerCase() === want);
  count.textContent = "";
  if (!p) {
    const sm = summonerFor(focusPlayer);
    view.innerHTML = sm ? `
      <div class="bothead">
        <button class="back">All players</button>
        <h2>${esc(sm.name)}</h2>
        <span class="where">not on the stats list</span>
      </div>
      <div class="caveat">We do not follow this player's skills \u2014 they
        are here because of the special days they have started.</div>
      <div class="cols">${daysPanel(sm.name)}<div></div></div>`
      : `<div class="empty">Not followed.</div>`;
    const back = view.querySelector(".back");
    if (back) back.onclick = () => go("players");
    return;
  }

  const group = kind => Object.entries(p.stats)
    .filter(([, v]) => v.k === kind)
    .sort((a, b) => b[1].v - a[1].v);

  const rankIn = skill => {
    const better = PUBLIC.filter(x => x.stats[skill]
      && x.stats[skill].v > p.stats[skill].v).length;
    return better + 1;
  };

  const table = (rows, title, ranked) => !rows.length ? "" : `
    <div><h3>${title}</h3><table>${rows.map(([stat, v]) => `<tr>
      <td>${esc(stat)}</td><td class="num brass">${v.v}</td>
      ${ranked ? `<td class="num sm">#${rankIn(stat)}</td>` : ""}
    </tr>`).join("")}</table></div>`;

  const mine = (DATA.movers || []).filter(m => m.name === p.name).slice(0, 12);

  view.innerHTML = `
    <div class="bothead">
      <button class="back">All players</button>
      <h2>${esc(p.name)}</h2>
      <span class="where">${p.overall ? "overall " + p.overall : ""}${
        p.private ? " \u00b7 privacy mode on" : ""}</span>
    </div>
    ${p.private ? `<div class="caveat">This player has hidden their stats.
      Only their achievements are public.</div>` : ""}
    <div class="cols">
      ${table(group("skill"), "Skills", true)}
      <div>
        ${table(group("attribute"), "Attributes", false)
          .replace("<div>", "").replace(/<\/div>$/, "")}
        ${daysPanel(p.name).replace("<div>", "").replace(/<\/div>$/, "")}
        ${p.pk ? `<h3 style="margin-top:18px">PK</h3><table>
          <tr><td>Score</td><td class="num brass">${p.pk.score.toFixed(2)}</td></tr>
          <tr><td>Fights</td><td class="num">${p.pk.f}</td></tr>
          <tr><td>Won</td><td class="num patina">${p.pk.w}</td></tr>
          <tr><td>Lost</td><td class="num">${p.pk.l}</td></tr>
          <tr><td>Win rate</td><td class="num">${
            (p.pk.w / p.pk.f * 100).toFixed(0)}%</td></tr></table>` : ""}
      </div>
      ${table(group("cross"), "Cross attributes", false)}
    </div>
    ${mine.length ? `<h3 style="margin-top:24px">Recent levels</h3>
      <table style="max-width:420px">${mine.map(m => `<tr>
        <td class="sm">${esc(m.at)}</td><td>${esc(m.stat)}</td>
        <td class="num brass">${m.now}</td></tr>`).join("")}</table>` : ""}
    ${p.ach ? `<h3 style="margin-top:24px">Achievements</h3>
      <div class="chips">${p.ach.split(/\s{2,}/).filter(Boolean)
        .map(a => `<span class="chip">${esc(a.trim())}</span>`).join("")}</div>`
      : ""}`;
  view.querySelector(".back").onclick = () => go("players");
}

function renderCraft(view, count, q) {
  if (!DATA.recipes || !DATA.recipes.length) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">No recipes imported yet.<br>
      <span class="sm">Run <code>python el_recipes.py import</code>
      and rebuild.</span></div>`;
    return;
  }
  let rows = DATA.recipes
    .filter(r => !q || r.item.toLowerCase().includes(q)
              || (r.skill || "").toLowerCase().includes(q)
              || r.ings.some(g => g.n.toLowerCase().includes(q)))
    .map(r => ({ r, c: cost(r, craftMode) }))
    .filter(x => !x.c.missing.length);

  if (!rows.length) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">${q ? "Nothing matches that."
      : "Nothing can be priced yet."}</div>`;
    return;
  }

  const k = sortKey, dir = sortKey ? sortDir : 1;
  const get = {
    item: x => x.r.item, skill: x => x.r.skill, level: x => x.r.level,
    cost: x => x.c.cost, sells: x => x.c.sells, profit: x => x.c.profit,
    margin: x => x.c.margin, exp: x => x.r.exp, perXp: x => x.c.perXp,
  }[k] || (x => x.c.profit);
  rows.sort((a, b) => {
    const x = get(a), y = get(b);
    if (typeof x === "string" || typeof y === "string")
      return dir * String(x ?? "").localeCompare(String(y ?? ""));
    return dir * ((x ?? -Infinity) < (y ?? -Infinity) ? 1 : -1);
  });

  const inProfit = rows.filter(x => x.c.profit > 0).length;
  count.textContent = `${rows.length} recipes priceable, ${inProfit} in profit`
    + ` \u00b7 ${DATA.meta.recipeCount} known`;

  view.innerHTML = `<div class="scroller"><table>${head([
    { t: "Item", k: "item" }, { t: "Skill", k: "skill" },
    { t: "Lvl", k: "level", num: 1, hide: 1 },
    { t: "Cost", k: "cost", num: 1 },
    { t: "Sells for", k: "sells", num: 1 },
    { t: "Profit", k: "profit", num: 1 },
    { t: "Margin", k: "margin", num: 1, hide: 1 },
    { t: "Exp", k: "exp", num: 1, hide: 1 },
    { t: "Gold per xp", k: "perXp", num: 1 },
  ])}<tbody>${rows.map(({ r, c }, i) => `
    <tr class="item ${openIds.has("c" + i) ? "open" : ""}" data-craft="${i}">
      <td><div class="nm"><span>${esc(r.item)}${c.gathered
        ? ` <span class="gathered" title="uses gathered materials">\u2726</span>`
        : ""}${c.gate ? ` <span class="gate" title="needs nexus ${
        c.gate} to gather the materials">nexus ${c.gate}</span>` : ""
        }</span></div></td>
      <td class="sm">${esc(r.skill)}</td>
      <td class="num sm hide-sm">${r.level ?? "\u2013"}</td>
      <td class="num">${fmt(c.cost)}</td>
      <td class="num patina">${fmt(c.sells)}${c.where === "vendor"
        ? ` <span class="sm">shop</span>` : ""}</td>
      <td class="num ${c.profit > 0 ? "brass" : "sm"}">${fmt(c.profit)}</td>
      <td class="num sm hide-sm">${c.margin == null ? "\u2013"
        : c.margin.toFixed(0) + "%"}</td>
      <td class="num sm hide-sm">${r.exp ? r.exp.toLocaleString("en-GB") : "\u2013"}</td>
      <td class="num ${c.perXp != null && c.perXp < 0 ? "patina" : ""}">${
        c.perXp == null ? "\u2013" : c.perXp.toFixed(2)}</td>
    </tr>${openIds.has("c" + i) ? craftDetail(r, c) : ""}`).join("")}
    </tbody></table></div>`;

  document.querySelectorAll("tr[data-craft]").forEach(tr => tr.onclick = () => {
    const id = "c" + tr.dataset.craft;
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    render();
  });
  wireSort(); wireBotLinks();
}

function craftDetail(r, c) {
  const rows = c.lines.map(l => {
    let desc, each;
    if (l.how === "buy") {
      desc = `${esc(l.n)} <span class="sm">from ${botLink(l.from)}</span>`;
      each = fmt(l.each);
    } else if (l.how === "gather") {
      const needs = [
        l.lvl ? "level " + Math.round(l.lvl) : null,
        l.tool || null,
        l.nexus ? "nexus " + Math.round(l.nexus) : null,
      ].filter(Boolean).join(", ");
      desc = `${esc(l.n)} <span class="gathered">gather${
        needs ? " \u2014 " + esc(needs) : ""}</span>`;
      each = l.each ? fmt(l.each) : "\u2013";
    } else {
      desc = `${esc(l.n)} <span class="sm">nobody sells it, you cannot gather it</span>`;
      each = "\u2013";
    }
    return `<div class="amt">${l.a}\u00d7</div><div>${desc}</div>
      <div class="each sm">${each}</div>
      <div class="sub">${l.each != null ? fmt(l.each * l.a) : "\u2013"}</div>`;
  }).join("");
  const sold = c.where === "bot" && c.who ? ` to ${botLink(c.who)}`
    : c.where === "vendor" ? " to a shop" : "";
  return `<tr class="detail"><td colspan="9"><div class="dwrap">
    <div class="ing">
      ${rows}
      <div class="rule"></div>
      <div></div><div class="sm">cost to make one</div>
      <div></div><div class="sub">${fmt(c.cost)}</div>
      <div></div><div class="sm">sells for${sold}</div>
      <div></div><div class="sub patina">${fmt(c.sells)}</div>
      <div></div><div>profit</div>
      <div></div><div class="sub ${c.profit > 0 ? "brass" : ""}">${fmt(c.profit)}</div>
      ${r.exp ? `<div></div><div class="sm">${r.exp.toLocaleString("en-GB")}
        experience, so ${c.perXp < 0 ? "you earn" : "it costs"}
        ${fmt(Math.abs(c.perXp))} a point</div><div></div><div></div>` : ""}
    </div>
    ${r.tool ? `<div class="sm" style="margin-top:12px">Needs ${esc(r.tool)}${
      r.food ? `, ${Math.round(r.food)} food` : ""}</div>` : ""}
  </div></td></tr>`;
}

function renderBotList(view, count, q) {
  let rows = DATA.bots.filter(b => !q ||
    b.name.toLowerCase().includes(q) ||
    (b.location || "").toLowerCase().includes(q) ||
    (b.owner || "").toLowerCase().includes(q));
  rows = sortRows(rows, "name");
  count.textContent = `${rows.length} bot${rows.length === 1 ? "" : "s"}`;
  view.innerHTML = `<div class="scroller"><table>${head([
    { t: "Bot", k: "name" }, { t: "Where", k: "location" },
    { t: "Land", k: "continent", hide: 1 }, { t: "Owner", k: "owner", hide: 1 },
    { t: "On sale", k: "sells", num: 1 }, { t: "Wanted", k: "buys", num: 1 },
    { t: "Slots", k: "slots", num: 1, hide: 1 },
    { t: "EMU free", k: "emu", num: 1, hide: 1 },
  ])}<tbody>${rows.map(b => `<tr>
    <td>${botLink(b.name)}</td>
    <td class="sm">${esc(b.location || "–")}${b.map_x != null
      ? ` [${b.map_x},${b.map_y}]` : ""}</td>
    <td class="sm hide-sm">${esc(b.continent || "–")}</td>
    <td class="sm hide-sm">${esc(b.owner || "–")}</td>
    <td class="num">${b.sells}</td>
    <td class="num">${b.buys}</td>
    <td class="num sm hide-sm">${b.slots ?? "\u2013"}</td>
    <td class="num hide-sm ${b.emu === 0 ? "t-sea" : "sm"}">${
      b.emu == null ? "\u2013" : b.emu.toLocaleString("en-GB")}</td></tr>`
    ).join("")}</tbody></table></div>`;
  wireSort(); wireBotLinks();
}

function renderBot(view, count) {
  const B = BOTS[focusBot], i = B.info;
  const where = (i.location || "unknown spot") +
    (i.map_x != null ? ` [${i.map_x},${i.map_y}]` : "");
  const room = i.emu == null ? ""
    : `, ${i.slots} slot${i.slots === 1 ? "" : "s"} and
       ${i.emu.toLocaleString("en-GB")} EMU free`;
  const col = (rows, title, cls, other) => `
    <div><h3>${title} <span>${rows.length}</span></h3>
    ${rows.length ? `<div class="scroller"><table><thead><tr>
      <th>Item</th><th class="num">Price</th><th class="num">Qty</th>
      <th class="num">Elsewhere</th></tr></thead><tbody>
      ${rows.slice().sort((a, b2) =>
          b2.price * Math.min(cap(b2.qty), 1e6)
        - a.price * Math.min(cap(a.qty), 1e6)).map(r => {
        const alt = r.item.best[other];
        const beats = alt && alt.bot !== focusBot &&
          (cls === "brass" ? alt.price > r.price : alt.price < r.price);
        return `<tr>
          <td><div class="nm">${icon(r.item)}<span>${esc(r.item.name)}</span></div></td>
          <td class="num ${cls}">${fmt(r.price)}</td>
          <td class="num sm">${qty(r.qty)}</td>
          <td class="num ${beats ? "patina" : "sm"}">${
            alt && alt.bot !== focusBot
              ? fmt(alt.price) + " " + botLink(alt.bot) : "–"}</td></tr>`;
      }).join("")}</tbody></table></div>`
      : `<div class="sm">Nothing.</div>`}</div>`;
  view.innerHTML = `
    <div class="bothead">
      <button class="back">All bots</button>
      <h2>${esc(focusBot)}</h2>
      <span class="where">${esc(where)}${
        i.owner ? `, run by ${esc(i.owner)}` : ""}${room}</span>
    </div>
    <div class="cols">
      ${col(B.sell, "On sale", "brass", "buy")}
      ${col(B.buy, "Wanted", "patina", "sell")}
    </div>`;
  count.textContent = "";
  view.querySelector(".back").onclick = () => go("bots");
  wireBotLinks();
}

applyRoute();
</script>
</body>
</html>

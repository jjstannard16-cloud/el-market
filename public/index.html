<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL Headquarters</title>
<!-- Without these the tab shows the browser's grey globe. The SVG is
     what every current browser uses; the PNG is for the ones that will
     not take an SVG, and for a bookmark or a phone home screen. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0f1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:  #0f1512;
    --panel:   #172019;
    --raised:  #1e2922;
    --line:    #2e3a31;
    --line-2:  #42513f;
    --ink:     #ece7d8;
    --muted:   #a3a08c;
    --dim:     #7f7d6c;
    --brass:   #dcb04a;
    --brass-d: #6b5420;
    --patina:  #6fa79b;
    --patina-d:#2c4a45;
    --rust:    #b4603f;
    --t-xs: 11.5px;   /* column labels, chips          */
    --t-sm: 13px;     /* secondary lines under a value */
    --t-md: 14.5px;   /* tables and body               */
    --t-lg: 16px;     /* section headings              */
    --display: "Fraunces", Georgia, serif;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 400 15px/1.5 var(--ui);
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 22px; }
  .num, th.num { font-variant-numeric: tabular-nums; }

  /* masthead ------------------------------------------------------- */
  .mast { border-bottom: 1px solid var(--line); }
  .mast { background: linear-gradient(180deg,
            rgba(220, 176, 74, .045), transparent 70%); }
  .mast .wrap {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 20px;
  }
  .mark { font-family: var(--display); font-size: 34px; font-weight: 600;
          line-height: 1; letter-spacing: -.015em; color: var(--ink);
          text-decoration: none; display: inline-block; }
  .mark:hover em { color: var(--ink); }
  .mark em { font-style: normal; color: var(--brass); }
  .ledger { display: flex; gap: 26px; }
  .ledger div { text-align: right; }
  .ledger .n { font-family: var(--display); font-size: 19px; font-weight: 600;
               line-height: 1.1; font-variant-numeric: tabular-nums; }
  .ledger .k { font-size: 12px; color: var(--muted); }

  /* the floor ------------------------------------------------------ */
  .floor { border-bottom: 1px solid var(--line); background: var(--panel); }
  .floor .wrap { padding-top: 18px; padding-bottom: 20px; }
  .floor h2 { font-family: var(--display); font-weight: 400;
              font-size: var(--t-lg); margin: 0 0 12px; color: var(--muted); }

  /* controls ------------------------------------------------------- */
  .bar { border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; gap: 18px;
               flex-wrap: wrap; padding-top: 0; }
  nav { display: flex; }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 14px 0; margin-right: 22px; cursor: pointer;
    font: 500 var(--t-md) var(--ui); transition: color .12s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .ic { width: 16px; height: 16px; flex: none; fill: none;
        stroke: currentColor; stroke-width: 1.6;
        stroke-linecap: round; stroke-linejoin: round; }
  /* The icon is a second way to read a label that is already there, so
     it is never the only thing carrying the meaning. */
  nav button .ic { opacity: .72; }
  nav button:hover .ic, nav button.on .ic { opacity: 1; }
  nav button:hover { color: var(--ink); }
  nav button.on { color: var(--brass); border-bottom-color: var(--brass); }
  .spacer { flex: 1; }
  /* Sits in the space the search box leaves on its own row, so it is on
     every page without taking a line of its own or asking to be read. */
  .saysomething { margin-left: auto; font-size: var(--t-sm);
                  color: var(--dim); white-space: nowrap; }
  .saysomething b { font-weight: 500; color: var(--brass); }
  /* Eleven tabs do not fit a phone. They scroll sideways rather than
     wrapping into two rows, and the search box drops below them. */
  @media (max-width: 860px) {
    .bar .wrap { gap: 10px; }
    nav { flex: 1 1 100%; overflow-x: auto; scrollbar-width: none;
          -webkit-overflow-scrolling: touch; }
    nav::-webkit-scrollbar { display: none; }
    nav button { margin-right: 18px; white-space: nowrap; padding: 12px 0; }
    nav button:last-child { margin-right: 2px; }
    input[type=search] { width: 100%; }
    .spacer { display: none; }
    /* On a phone it goes under the search box rather than beside it,
       and loses the half of the sentence that was only politeness. */
    .saysomething { margin-left: 0; flex: 1 1 100%; white-space: normal;
                    font-size: var(--t-xs); padding-bottom: 8px; }
  }
  input[type=search] {
    width: 260px; padding: 7px 11px; border-radius: 3px;
    border: 1px solid var(--line-2); background: var(--ground);
    color: var(--ink); font: 400 14px var(--ui);
  }
  input[type=search]::placeholder { color: #6a6a5c; }
  .walk { display: none; gap: 7px; align-items: center; color: var(--muted);
          font-size: 13.5px; cursor: pointer; user-select: none; }
  .walk input { accent-color: var(--brass); }
  .modes { display: none; align-items: center; gap: 0; font-size: 13px; }
  .modes .lbl { color: var(--muted); margin-right: 10px; }
  .modes button {
    background: none; border: 1px solid var(--line-2); border-right: 0;
    color: var(--muted); padding: 5px 11px; cursor: pointer;
    font: 400 12.5px var(--ui);
  }
  .modes button:first-of-type { border-radius: 3px 0 0 3px; }
  .modes button:last-of-type { border-right: 1px solid var(--line-2);
                               border-radius: 0 3px 3px 0; }
  .modes button:hover { color: var(--ink); }
  .modes button.on { color: var(--ground); background: var(--brass);
                     border-color: var(--brass); }
  .gathered { color: var(--patina); }
  .pills { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 18px; }
  .pills .pill { background: none; border: 1px solid var(--line-2);
    color: var(--muted); padding: 5px 12px; border-radius: 3px;
    cursor: pointer; font: 400 12.5px var(--ui); }
  .pills .pill:hover { color: var(--ink); border-color: var(--brass); }
  .pills .pill.on { color: var(--ground); background: var(--brass);
                    border-color: var(--brass); }
  .namegrid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px; }
  /* Two hundred names wrapped by their own widths is a jumble: nothing
     lines up and the eye has no column to follow. A grid of equal cells
     gives it rows and columns to read down instead. */
  /* Two hundred names want to be a list, not two hundred boxes: a box
     each is mostly border and padding and runs off the bottom of the
     screen. Plain names in columns fit on one. */
  .names { display: grid; gap: 0 14px; margin-bottom: 4px;
           grid-template-columns: repeat(auto-fill, minmax(106px, 1fr)); }
  .names.big { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
               margin-bottom: 26px; }
  /* The names are the content here, not a note about it, so they are
     ink. At muted they sat at exactly the weight of the sentence above
     explaining them, which is the wrong way round. Brass was tried and
     is too much: 196 gold names is a wall, and brass means something
     elsewhere on the page - spending it here would cheapen it. */
  .names > * { font-size: var(--t-sm); line-height: 1.75; color: var(--ink);
               text-decoration: none; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; padding: 0 3px; border-radius: 2px; }
  .names a:hover { color: var(--brass); background: var(--panel); }
  .names span { color: var(--dim); }
  /* The map label sits beside its bots, not above them: most maps have
     only a few bots on, and a heading of its own doubled their height. */
  .land { margin-bottom: 18px; }
  .land > h3 { font-family: var(--display); font-weight: 500;
               font-size: var(--t-lg); color: var(--ink);
               margin: 0 0 6px; padding-bottom: 5px;
               border-bottom: 1px solid var(--line); }
  .land > h3 em { font-style: normal; font-family: var(--ui);
                  font-size: var(--t-xs); color: var(--dim);
                  letter-spacing: .06em; margin-left: 5px; }
  .land > h3 .count { color: var(--dim); font-size: var(--t-sm);
                      font-weight: 400; margin-left: 7px; }
  .maprow { display: grid; grid-template-columns: 136px 1fr; gap: 0 18px;
            align-items: baseline; padding: 3px 0; }
  .maprow h4 { font-family: var(--ui); font-size: var(--t-xs);
               font-weight: 500; letter-spacing: .04em; color: var(--dim);
               margin: 0; text-align: right; white-space: nowrap; }
  .maprow h4 span { color: var(--line-2); margin-left: 5px; }
  @media (max-width: 760px) {
    .maprow { grid-template-columns: 1fr; gap: 0; }
    .maprow h4 { text-align: left; margin-bottom: 1px; }
  }
  @media (max-width: 620px) {
    .names, .names.big {
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  }
  /* A badge is a small drawing, so it is smoothed, and the chip turns
     into a row so the picture and the name sit beside each other. */
  .namegrid .chip:has(.badge) { display: inline-flex; align-items: center;
                                gap: 7px; padding: 4px 10px 4px 5px; }
  .badge { width: 26px; height: 26px; object-fit: contain; flex: none; }
  /* An NPC portrait is a drawing at 96 square, so it is smoothed. */
  .nm img.face { width: 28px; height: 28px; border-radius: 3px;
                 image-rendering: auto; }
  .qhead { display: flex; align-items: center; gap: 14px; margin: 0 0 4px; }
  .qhead img { width: 64px; height: 64px; border-radius: 4px; flex: none;
               background: var(--panel); border: 1px solid var(--line); }
  .qhead h2 { margin: 0; }
  .namegrid .chip { font-family: var(--sans); font-size: var(--t-sm);
          color: var(--muted); border: 1px solid var(--line-2);
          border-radius: 3px; padding: 5px 10px; text-decoration: none;
          line-height: 1.3; }
  .namegrid a.chip:hover { color: var(--ink); border-color: var(--brass);
                           background: var(--raised); }
  .namegrid .chip.trades { color: var(--ink); }
  .namegrid .chip span { display: block; font-size: var(--t-xs);
                         color: var(--dim); margin-top: 1px; }
  .evkind { font-family: var(--sans); font-size: 11px; letter-spacing: .03em;
            color: var(--muted); border: 1px solid var(--line-2);
            border-radius: 2px; padding: 2px 7px; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 5px; }
  .evkind .ic { width: 12px; height: 12px; stroke-width: 1.8; }
  table.ranktable { width: 100%; border-collapse: collapse;
                   font-size: 13.5px; margin-bottom: 10px; }
  @media (max-width: 620px) {
    table.ranktable { font-size: 12px; }
    table.ranktable th, table.ranktable td { padding-right: 6px; }
    table.ranktable th:nth-child(4), table.ranktable td:nth-child(4) {
      display: none; }
  }
  table.ranktable th { font-family: var(--sans); font-size: 11px;
    font-weight: 500; letter-spacing: .04em; color: var(--muted);
    text-align: left; padding: 0 10px 6px 0;
    border-bottom: 1px solid var(--line); }
  table.ranktable td { padding: 7px 10px 7px 0;
                       border-bottom: 1px solid var(--line); }
  .put { font-family: var(--sans); font-size: 11px; letter-spacing: .03em;
         border: 1px solid var(--line-2); border-radius: 2px;
         padding: 2px 7px; white-space: nowrap; }
  .put.inventory { color: var(--brass); border-color: var(--brass); }
  .put.storage { color: var(--patina, var(--muted)); }
  .qnpc { font-size: 14.5px; margin: 2px 0 12px; }
  /* The item page's tables are narrow lists of two or three columns, so
     they are laid out to the content rather than stretched to the page. */
  table.itab { border-collapse: collapse; font-size: var(--t-md);
               margin-bottom: 4px; min-width: 340px; max-width: 620px; }
  table.itab th { text-align: left; color: var(--dim); font-weight: 500;
                  font-size: var(--t-sm); padding: 0 16px 7px 0;
                  border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.itab td { padding: 8px 16px 8px 0;
                  border-bottom: 1px solid var(--line); }
  table.itab th.num, table.itab td.num { text-align: right;
                  font-variant-numeric: tabular-nums; }
  table.itab .wide { width: 99%; }
  table.itab th:last-child, table.itab td:last-child { padding-right: 0; }
  @media (max-width: 620px) {
    table.itab { min-width: 0; width: 100%; }
    table.itab th, table.itab td { padding-right: 9px; }
  }
  .note { color: var(--muted); font-size: var(--t-md); line-height: 1.55;
          max-width: 74ch; margin: -2px 0 14px; }
  .note b { color: var(--ink); }
  a.iname { color: inherit; text-decoration: none;
            border-bottom: 1px solid var(--line-2); }
  a.iname:hover { color: var(--brass); border-bottom-color: var(--brass); }
  .qnpc b { color: var(--brass); font-weight: 500; }
  .coord { font-family: var(--mono, monospace); font-size: 12.5px;
           color: var(--muted); }
  .qintro { font-size: 14.5px; max-width: 70ch; color: var(--ink);
            margin: 0 0 14px; }
  .qblock { margin-bottom: 26px; }
  .qblock h3 { font-family: var(--display); font-weight: 500;
               font-size: var(--t-lg); margin: 0 0 10px; color: var(--ink); }
  ul.plain { margin: 0; padding-left: 18px; font-size: 13.5px; }
  ul.plain li { padding: 3px 0; }
  ol.steps { margin: 0; padding-left: 20px; font-size: 14px;
             max-width: 78ch; }
  ol.steps > li { padding: 5px 0; line-height: 1.55; }
  ol.sub { list-style: lower-alpha; margin: 6px 0 2px; padding-left: 20px;
           font-size: 13.5px; color: var(--muted); }
  /* The guide's tables are set in spaces and some are very wide, so the
     block scrolls on its own rather than stretching the page. */
  .qblock { min-width: 0; }
  pre.guide { font: 12px/1.5 var(--mono, ui-monospace, monospace);
    color: var(--ink); background: var(--panel, rgba(255,255,255,.02));
    border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px;
    overflow-x: auto; white-space: pre; max-width: 100%; }
  table.quests { table-layout: fixed; width: 100%; }
  table.quests td, table.quests th { overflow-wrap: anywhere; }
  @media (max-width: 620px) {
    /* Six columns do not fit a phone, so the dates go and the counts stay. */
    table.finders td:nth-child(n+5), table.finders th:nth-child(n+5) {
      display: none; }
    table.quests td:nth-child(4), table.quests th:nth-child(4) { display: none; }
    table.quests td:nth-child(3), table.quests th:nth-child(3) {
      font-size: 12px; }
    pre.guide { font-size: 10.5px; }
    ol.steps { padding-left: 16px; }
  }
  .pick { display: none; padding: 5px 9px; border-radius: 3px;
          border: 1px solid var(--line-2); background: var(--ground);
          color: var(--ink); font: 400 13px var(--ui); }
  .caveat { color: var(--muted); font-size: 12.5px; margin: -2px 0 12px; }
  .hidden-row td { color: var(--muted); }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chips .tag { font-size: var(--t-xs); border: 1px solid var(--line-2);
          border-radius: 10px; padding: 2px 9px; color: var(--muted); }
  /* A wave number is one character wide and the three figures beside
     it are short, so left to itself the table hands them a third of the
     page each and the creatures end up squeezed into the middle with a
     gutter in front of them. The narrow columns are pinned and the
     creatures take what is left. */
  /* There are six to ten rows behind a door and a column 800 pixels
     wide to put them in, so the creatures are worth looking at here
     rather than squinting at a 20 pixel thumbnail. */
  .waves .nm { gap: 12px; }
  .waves .nm img, .waves .nm .noimg { width: 46px; height: 46px; }
  .waves td { vertical-align: middle; }
  .waves th:first-child, .waves td:first-child { width: 58px; }
  .waves th:nth-child(3), .waves td:nth-child(3) { width: 120px; }
  .waves th:last-child, .waves td:last-child { width: 130px; }
  /* The handful of facts that decide whether you can go in at all:
     level range, how many people, how long, how often. */
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 10px; }
  .facts .fact { font-size: var(--t-xs); border: 1px solid var(--line-2);
                 border-radius: 3px; padding: 3px 9px; color: var(--muted);
                 background: var(--panel); }
  /* "130x" in front of a creature. Lining figures, so a wave of 130
     and a wave of 1 line up down the column. */
  .many { color: var(--brass); font-variant-numeric: tabular-nums;
          margin-right: 1px; white-space: nowrap; }
  h2.group { font-family: var(--display); font-weight: 500; font-size: 19px;
             color: var(--ink); margin: 34px 0 12px; letter-spacing: -.01em;
             border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  h2.group:first-child { margin-top: 6px; }
  h2.group .count { color: var(--dim); font-size: var(--t-sm);
                    font-weight: 400; }
  h2.group.withicon { display: flex; align-items: center; gap: 10px; }
  h2.group.withicon .ic { width: 19px; height: 19px; color: var(--brass); }
  h2.group.withicon img { width: 24px; height: 24px; object-fit: contain;
                          image-rendering: pixelated; }
  .today { border: 1px solid var(--line-2); border-left-width: 3px;
           border-radius: 3px; padding: 15px 18px; margin: 2px 0 6px;
           background: var(--panel); }
  .today .dayname { font-family: var(--display); font-size: 25px;
                    font-weight: 600; line-height: 1.1; }
  .today .daywhat { margin-top: 5px; font-size: 14px; max-width: 62ch; }
  .today .daywhen { margin-top: 7px; font-size: 12.5px; color: var(--muted); }
  .k-good     { border-left-color: var(--patina); }
  .k-good .dayname { color: var(--patina); }
  .k-bad      { border-left-color: var(--rust); }
  .k-bad .dayname  { color: var(--rust); }
  .k-mixed    { border-left-color: var(--brass); }
  .k-mixed .dayname { color: var(--brass); }
  .dayic { width: 17px; height: 17px; flex: none; margin-top: 2px; }
  .dayic.k-good { color: var(--patina); }
  .dayic.k-bad { color: var(--rust); }
  .dayic.k-mixed { color: var(--brass); }
  .dayic.k-ordinary, .dayic.k-unknown { color: var(--dim); }
  .k-ordinary, .k-unknown { border-left-color: var(--line-2); }
  .k-ordinary .dayname, .k-unknown .dayname { color: var(--ink); }
  .daylog td:first-child { white-space: nowrap; }
  .daylog td { vertical-align: top; }
  .daydot { display: inline-block; width: 7px; height: 7px; border-radius: 4px;
            margin-right: 9px; vertical-align: 1px;
            background: var(--line-2); }
  .daydot.k-good { background: var(--patina); }
  .daydot.k-bad { background: var(--rust); }
  .daydot.k-mixed { background: var(--brass); }
  .stonecell { white-space: nowrap; text-align: right; }
  .daylog thead th { font-family: var(--sans); font-size: 11px;
    font-weight: 500; letter-spacing: .05em; color: var(--muted);
    text-align: left; padding-bottom: 6px; border-bottom: 1px solid var(--line);}
  .daylog thead th.stonecell { text-align: right; }
  .grouphint { font-size: var(--t-md); color: var(--muted);
               margin: -4px 0 16px; max-width: 78ch; line-height: 1.55; }
  .seen { font-family: var(--sans); font-size: 11.5px; color: var(--muted);
          margin-top: 3px; }
  .pos { display: inline-block; min-width: 24px; color: var(--dim);
         font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
  .pos.medal { color: var(--brass); font-weight: 600; }
  .more { font-family: var(--sans); font-size: 13px; color: var(--muted);
          background: none; border: 1px solid var(--line-2);
          border-radius: 3px; padding: 7px 14px; margin-top: 14px;
          cursor: pointer; }
  .more:hover { color: var(--ink); border-color: var(--brass); }
  .panelhint { font-family: var(--sans); font-size: 11.5px;
               color: var(--muted); margin: -8px 0 10px; }
  table.ranks td { padding: 5px 8px 5px 0; font-size: 13.5px; }
  table.ranks td:first-child { width: 45%; }
  .barcell { width: 40%; }
  /* Named meter, not bar: ".bar" is the navigation strip, and sharing
     the name clipped the whole navigation to seven pixels. */
  .meter { display: block; height: 7px; background: var(--line);
           border-radius: 1px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--brass);
             opacity: .62; }
  .years { margin-top: 30px; }
  .years h3, .ranks + h3 { font-family: var(--display); font-weight: 500;
                           font-size: 17px; color: var(--ink); margin: 0 0 4px; }
  @media (max-width: 620px) {
    /* Twenty-four labelled bars will not fit a phone whatever the font,
       so the chart scrolls inside its own box rather than the page. */
    .yearbars { height: 84px; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
    .yb { flex: 0 0 26px; }
    .yb b { font-size: 9.5px; }
    .yb span { font-size: 9px; }
    table.ranks td:first-child { width: auto; }
    .barcell { display: none; }
  }
  .yearbars { display: flex; align-items: flex-end; gap: 6px; height: 110px;
              margin-top: 10px; }
  /* A flex child will not shrink below its own content unless it is
     told it may, so the hour labels were holding the chart wider than
     the screen once there were enough of them to matter. */
  .yb { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-end; height: 100%; }
  .ybstack { width: 100%; max-width: 46px; background: var(--brass);
             opacity: .62; border-radius: 2px 2px 0 0; min-height: 2px; }
  .yb.partial .ybstack { opacity: .3; }
  .yb b { font-family: var(--sans); font-size: 11px; font-weight: 500;
          color: var(--muted); margin-bottom: 4px;
          font-variant-numeric: tabular-nums; }
  .yb span { font-family: var(--sans); font-size: 10.5px;
             color: var(--muted); margin-top: 6px; }
  .stone { display: inline-block; font-size: 12.5px; color: var(--brass); }
  .stone.sm { color: var(--muted); }
  .gclock { font-variant-numeric: tabular-nums; color: var(--ink);
            letter-spacing: .02em; }
  .today .warning { font-family: var(--sans); font-size: 13px;
    color: var(--rust); margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--line); }
  .tier { font-family: var(--sans); font-size: 10px; letter-spacing: .08em;
          color: var(--brass); padding: 0 1px; vertical-align: 1px; }
  /* In a chip the tier sits under the name, where a box around it read
     as an empty text field rather than a rank. */
  .namegrid .chip .tier { display: block; margin-top: 1px;
                          letter-spacing: .14em; }
  /* The game draws a guild's tag above its members' heads, so it reads
     as a badge rather than as a word in a sentence. */
  .gtag { display: inline-block; font-family: var(--mono, ui-monospace,
          SFMono-Regular, Menlo, monospace); font-size: 12.5px;
          letter-spacing: .04em; color: var(--brass);
          border: 1px solid var(--line-2); border-radius: 3px;
          padding: 1px 7px; background: rgba(0,0,0,.25);
          white-space: nowrap; vertical-align: 1px; }
  .gtag.big { font-size: 15px; padding: 3px 10px; letter-spacing: .06em; }
  .unsure { font-family: var(--sans); font-size: 11px; font-weight: 500;
            letter-spacing: .04em; color: var(--muted);
            border: 1px solid var(--line-2); border-radius: 2px;
            padding: 1px 5px; vertical-align: 2px; }
  .today a { color: inherit; text-decoration: underline;
             text-underline-offset: 3px; }
  /* An index of the site, not a row of cards: the count is the reason
     to click, so it is the thing that carries colour, and the rule down
     the left does the work a border box was doing. */
  .sections { display: grid; gap: 0 34px;
              grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  .sec { display: block; padding: 13px 14px 14px; text-decoration: none;
         color: inherit; border-left: 2px solid var(--line-2);
         border-bottom: 1px solid var(--line); }
  .sec:hover { border-left-color: var(--brass); background: var(--panel); }
  .sec .sechead { display: flex; align-items: baseline; gap: 12px;
                  justify-content: space-between; }
  .sec .nm2 { font-family: var(--display); font-size: var(--t-lg);
              color: var(--ink); display: inline-flex; align-items: center;
              gap: 9px; }
  .secic { width: 17px; height: 17px; color: var(--brass); opacity: .75; }
  .sec:hover .secic { opacity: 1; }
  .sec .sm { display: block; line-height: 1.45; color: var(--muted);
             margin-top: 3px; max-width: 40ch; font-size: var(--t-sm); }
  .sec .tally2 { font-size: var(--t-sm); color: var(--brass);
                 white-space: nowrap; font-variant-numeric: tabular-nums; }
  .skillgrid { display: grid; gap: 26px 30px;
               grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
  .skillcol h3 { font-family: var(--display); font-weight: 400; font-size: 16px;
                 margin: 0 0 6px; color: var(--brass); }
  .skillcol table { font-size: 13.5px; }
  .skillcol td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); }
  .skillcol td:first-child { width: 2rem; }
  .skillcol td:last-child { text-align: right; padding-right: 0; }
  button.more { margin-top: 8px; background: none; border: 0; padding: 0;
                color: var(--muted); font: 400 12.5px var(--ui);
                cursor: pointer; border-bottom: 1px solid var(--line-2); }
  button.more:hover { color: var(--brass); border-bottom-color: var(--brass); }
  /* The nexus is a second gate on making something, and the skill level
     on its own reads as the only one. */
  .nx { display: block; font-family: var(--sans); font-size: var(--t-xs);
        color: var(--dim); letter-spacing: .02em; margin-top: 1px; }
  .gate { font-size: 11.5px; color: var(--rust); border: 1px solid #4e2e26;
          border-radius: 10px; padding: 1px 7px; white-space: nowrap; }
  .ing { display: grid; grid-template-columns: 2.4rem 1fr auto auto;
         gap: 4px 14px; align-items: baseline; font-size: 13.5px;
         max-width: 620px; }
  .ing .amt { color: var(--muted); text-align: right; }
  .ing .each, .ing .sub { text-align: right; font-variant-numeric: tabular-nums; }
  .ing .rule { grid-column: 1 / -1; border-top: 1px solid var(--line-2);
               margin: 5px 0 1px; }

  /* tables --------------------------------------------------------- */
  main .wrap { padding-top: 16px; padding-bottom: 56px; }
  .meta-line { color: var(--muted); font-size: var(--t-sm);
               margin-bottom: 10px; }
  .scroller { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse;
          font-size: var(--t-md); line-height: 1.45; }
  th {
    text-align: left; padding: 9px 12px; color: var(--dim);
    font-weight: 500; font-size: var(--t-sm);
    border-bottom: 1px solid var(--line-2);
    position: sticky; top: 0; background: var(--ground); cursor: pointer;
    white-space: nowrap;
  }
  th:hover { color: var(--ink); }
  th.num, td.num { text-align: right; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line);
       vertical-align: top; }
  /* The roomier rows are for a desk. On a phone the same padding pushes
     every wide table off the side of the screen. */
  @media (max-width: 620px) {
    table { font-size: var(--t-sm); }
    th, td { padding: 8px 7px; }
    th:first-child, td:first-child { padding-left: 0; }
    th:last-child, td:last-child { padding-right: 0; }
  }
  /* A table laid out automatically hands its spare width to whichever
     column holds the widest content, which here is the item name - so
     a short name ended up marooned half a screen from its own price.
     Naming the shares puts the slack in the two columns that vary, the
     seller and the buyer, and brings the prices back to the names. */
  table.mkt th:nth-child(1) { width: 26%; }
  table.mkt th:nth-child(2), table.mkt th:nth-child(5) { width: 10%; }
  table.mkt th:nth-child(3), table.mkt th:nth-child(6) { width: 17%; }
  table.mkt th:nth-child(4), table.mkt th:nth-child(7) { width: 8%; }
  @media (max-width: 860px) {
    table.mkt th { width: auto; }
  }
  /* Long tables are easier to track across with a faint banding than
     with a border alone, which at this contrast all but disappears. */
  tbody tr:nth-child(even) > td { background: rgba(255, 255, 255, .017); }
  tbody tr:hover > td { background: var(--panel); }
  tr.item { cursor: pointer; }
  tr.item.open > td { background: var(--raised); }
  .nm { display: flex; align-items: center; gap: 10px; }
  .nm img, .nm .noimg { width: 20px; height: 20px; object-fit: contain;
            flex: none; image-rendering: pixelated; }
  /* A creature thumbnail is a drawing, not a sprite; let it smooth. */
  .nm img.beast { image-rendering: auto; border-radius: 2px; }
  .sm { color: var(--muted); font-size: var(--t-sm); }
  .muted { color: var(--muted); }
  .brass { color: var(--brass); }
  .patina { color: var(--patina); }
  a.lnk { color: var(--ink); text-decoration: none;
          border-bottom: 1px solid var(--line-2); cursor: pointer; }
  a.lnk:hover { color: var(--brass); border-bottom-color: var(--brass); }

  .trip { font-size: 12px; white-space: nowrap; }
  .t-map  { color: var(--patina); }
  .t-cont { color: var(--ink); }
  .t-sea  { color: var(--rust); }

  /* expanded item -------------------------------------------------- */
  .detail > td { background: var(--panel); padding: 0;
                 border-bottom: 1px solid var(--line-2); }
  .dwrap { padding: 16px 14px 20px; }
  .verdict { font-size: 14px; margin-bottom: 16px; }
  .verdict b { font-weight: 600; }

  .axis { margin: 0 6px 20px; }
  .track { position: relative; height: 3px; background: var(--line);
           border-radius: 2px; }
  .overlap { position: absolute; top: 0; height: 3px; background: var(--patina-d); }
  .pin { position: absolute; width: 2px; border-radius: 1px;
         transform: translateX(-1px); }
  .pin.s { top: -7px; height: 17px; background: var(--brass); }
  .pin.b { top: -7px; height: 17px; background: var(--patina); }
  .ends { display: flex; justify-content: space-between; margin-top: 12px;
          font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .swatch { display: inline-block; width: 2px; height: 10px;
            vertical-align: -1px; margin-right: 5px; }

  .cols { display: flex; gap: 36px; align-items: flex-start; flex-wrap: wrap; }
  .cols > div { flex: 1 1 320px; min-width: 0; }
  .cols h3 { font-family: var(--display); font-weight: 500; font-size: 17px;
             margin: 0 0 7px; color: var(--ink); }
  .cols h3 span { color: var(--muted); font-size: var(--t-sm);
                  font-family: var(--ui); font-weight: 400; }
  .cols table { font-size: var(--t-md); }
  .nowrap { white-space: nowrap; }
  .seeall { display: inline-block; margin-top: 10px; font-family: var(--sans);
            font-size: 12.5px; color: var(--muted); text-decoration: none; }
  .seeall:hover { color: var(--brass); }
  .cols td { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); }

  /* bot page ------------------------------------------------------- */
  .bothead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
             margin: 2px 0 22px; }
  .bothead h2 { font-family: var(--display); font-weight: 600; font-size: 26px;
                margin: 0; }
  .bothead .where { color: var(--muted); font-size: 13.5px; }
  /* The artwork is a 32px game sprite. Doubling it with smoothing turns
     it to mush, so it is kept on the pixel grid and shown as drawn. */
  .bothead.withpic { align-items: center; }
  /* With a full portrait the name reads as the artwork's title, so it
     sits on the picture's foot rather than floating halfway up it. */
  .bothead.bigpic { align-items: flex-end; }
  .bothead.bigpic h2 { line-height: 1; }
  .bothead .pic { width: 64px; height: 64px; flex: none; padding: 7px;
                  object-fit: contain; image-rendering: pixelated;
                  background: var(--panel); border: 1px solid var(--line);
                  border-radius: 3px; }
  /* A creature portrait is a real drawing, not a sprite, so it is
     smoothed and given room; the 25px thumbnails stay on the grid. */
  .bothead .pic.photo { width: auto; height: auto; max-height: 200px;
                        max-width: min(360px, 100%); padding: 0;
                        object-fit: contain; image-rendering: auto;
                        border-radius: 4px; }
  .bothead .pic.tiny { width: 46px; height: 46px; padding: 5px; }
  @media (max-width: 620px) {
    .bothead .pic.photo { max-height: 150px; }
  }
  .back { background: none; border: 1px solid var(--line-2); color: var(--muted);
          padding: 5px 11px; border-radius: 3px; cursor: pointer;
          font: 400 13px var(--ui); }
  .back:hover { color: var(--ink); border-color: var(--muted); }

  .empty { padding: 56px 0; text-align: center; color: var(--muted); }
  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding-top: 20px; padding-bottom: 44px;
                 color: var(--muted); font-size: 12.5px; line-height: 1.65; }
  .footgrid { display: grid; gap: 18px 36px;
              grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .footgrid b { color: var(--ink); font-weight: 600; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace;
         background: var(--panel); padding: 1px 5px; border-radius: 2px;
         font-size: 12px; color: var(--ink); }
  a { color: var(--brass); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 860px) {
    .mast .wrap { padding-bottom: 14px; }
    .ledger { gap: 18px; }
    input[type=search] { width: 100%; }
    .hide-sm { display: none; }
  }
</style>
</head>

<script>
if (typeof DATA === "undefined") {
  document.getElementById("view").innerHTML =
    `<div class="empty">Could not load data.js.<br>
     <span class="sm">It must sit next to index.html. Rebuild with
     <code>python el_site.py</code>.</span></div>`;
  throw new Error("data.js missing");
}
const m = DATA.meta;
let tab = "market", sortKey = null, sortDir = 1, focusBot = null;
const openIds = new Set();
const AUTO_OPEN_UPTO = 5;

const UNLIMITED = -1;
const cap = q => q === UNLIMITED ? Infinity : q;

/* crafting ------------------------------------------------------------
   An ingredient you gather is not free: if a bot buys it, using one costs
   you that sale. "value" prices gathered materials at what bots pay,
   which is the number that says whether crafting beats selling the raw
   materials. "free" ignores that, "buy" refuses to gather at all.        */

const PRICE = {};
for (const it of DATA.items) {
  const k = it.name.toLowerCase();
  PRICE[k] = {
    sell: (it.sell.filter(x => x.qty !== 0)[0] || {}).price ?? null,
    sellBot: (it.sell.filter(x => x.qty !== 0)[0] || {}).bot ?? null,
    buy: (it.buy.filter(x => x.qty !== 0)[0] || {}).price ?? null,
    buyBot: (it.buy.filter(x => x.qty !== 0)[0] || {}).bot ?? null,
  };
}
const HARVEST = DATA.harvestables || {};

function cost(r, mode) {
  let total = 0;
  const lines = [], missing = [], tools = [];
  let anyGathered = false, gate = 0;
  for (const g of r.ings) {
    const k = g.n.toLowerCase();
    const p = PRICE[k] || {};
    if (p.sell != null) {
      total += p.sell * g.a;
      lines.push({ ...g, each: p.sell, from: p.sellBot, how: "buy" });
    } else if (k in HARVEST && mode !== "buy") {
      anyGathered = true;
      const worth = mode === "value" ? (p.buy || 0) : 0;
      total += worth * g.a;
      const h = HARVEST[k] || {};
      lines.push({ ...g, each: worth, how: "gather",
                   lvl: h.lvl, tool: h.tool, nexus: h.nexus });
      if (h.nexus) gate = Math.max(gate, h.nexus);
      if (h.tool && !tools.includes(h.tool)) tools.push(h.tool);
    } else {
      missing.push(g.n);
      lines.push({ ...g, each: null, how: "none" });
    }
  }
  const p = PRICE[r.item.toLowerCase()] || {};
  let each = p.buy, where = "bot", who = p.buyBot;
  if (each == null && r.vendor != null) { each = r.vendor; where = "vendor"; who = null; }
  if (each == null) { each = 0; where = "nobody"; }
  // A mix of magic arrows takes fifty of each ingredient and gives back
  // seventy-five arrows. The cost above is for the whole mix, so what it
  // is worth has to be for the whole mix too; comparing it with the
  // price of one arrow had the tab reporting a 45,000 loss on a batch
  // that sells for 2,625. The wiki calls the number resamount, and a
  // recipe without one makes a single item.
  const makes = r.makes > 1 ? r.makes : 1;
  const sells = each * makes;
  const profit = sells - total;
  return {
    cost: total, lines, missing, gathered: anyGathered,
    gate, tools, sells, each, makes, where, who, profit,
    margin: total > 0 ? profit / total * 100 : null,
    perXp: r.exp > 0 ? -profit / r.exp : null,
  };
}

// A day lasts about six hours, and the only clock we can read is the one
// in the bot site's header. When that header stops moving, the honest
// thing is to say we cannot tell, not to print a date from last week.
function todayBanner() {
  const t = DATA.today;
  if (!t) return "";
  if (t.stale) return `<div class="today k-unknown">
    <div class="dayname">We cannot tell you what day it is</div>
    <div class="daywhat">Special days last about six hours. The clock we
      read, in the header of the bot site, has shown the same reading for
      ${Math.round(t.heldHours)} hours, so it is not keeping time. Type
      <b>#day</b> in game for the real answer.</div>
    <div class="daywhen">Everything below is still accurate: what each day
      does, and what it costs to start one yourself.</div>
  </div>`;
  // Mercator gives the month as a number and nobody publishes the names,
  // so the date is written the way the game writes it.
  const numeric = /^\d+$/.test(String(t.month || ""));
  const when = numeric
    ? `${t.day}-${t.month}-${String(t.year).padStart(4, "0")}`
    : [t.day ? ordinal(t.day) : null, t.month ? "of " + t.month : null,
       t.year != null ? "year " + String(t.year).padStart(4, "0") : null]
      .filter(Boolean).join(" ");
  const g = gameNow();
  return `<div class="today k-${esc(t.ticked ? t.kind : "unknown")}">
    <div class="dayname">${esc(t.special)}${
      t.ticked ? "" : ` <span class="unsure">unconfirmed</span>`}</div>
    ${t.what ? `<div class="daywhat">${esc(t.what)}</div>` : ""}
    ${g && !g.stale
      ? `<div class="daywhen"><span id="gclock" class="gclock">${
          gameDate(g)} \u00b7 ${g.h}:${String(g.m).padStart(2, "0")}</span>
         <span class="muted">game time, running</span></div>`
      : when ? `<div class="daywhen">${esc(when)}${
          t.ticked ? "" : ` \u2014 this is what the bot site header says, but
          we have not yet watched it change, so check with <b>#day</b> in
          game`}</div>` : ""}
    ${g && g.warning ? `<div class="warning">${esc(g.warning)}${
      g.monsters ? ` <span class="muted">${fmt(g.monsters)} monsters</span>`
      : ""}</div>` : ""}
  </div>`;
}

// A game day is six real hours and the clock runs 0:00 to 5:59, measured
// off fifteen years of announcements rather than assumed. So the page can
// run the clock on from the last reading; the hourly reading only has to
// correct for the server having been down.
const GAME_DAY_MINUTES = 360;
const REAL_MS_PER_GAME_MINUTE = 60000;

function gameNow() {
  const c = DATA.clock;
  if (!c) return null;
  const read = Date.parse(c.at);
  if (!read) return null;
  const elapsed = Math.floor((Date.now() - read) / REAL_MS_PER_GAME_MINUTE);
  // A reading much older than an hour means the scrape is not running,
  // and a clock that has drifted for days is worse than no clock.
  const stale = Date.now() - read > 3 * 3600 * 1000;
  let total = c.h * 60 + c.m + Math.max(0, elapsed);
  const rolled = Math.floor(total / GAME_DAY_MINUTES);
  total %= GAME_DAY_MINUTES;
  let day = (c.day || 1) + rolled, month = c.month || 1, year = c.year || 0;
  while (day > 30) { day -= 30; month += 1; }
  while (month > 12) { month -= 12; year += 1; }
  return {
    h: Math.floor(total / 60), m: total % 60, day, month, year, stale,
    readAt: read,
    // Shown only while it is still news: Mercator keeps the text up long
    // after the invasion, so the clock goes by when it first appeared.
    warning: (Date.now() - Date.parse(c.warnSince || c.at) < 25 * 60 * 1000
              && !/invasion is over/i.test(c.warning || ""))
      ? c.warning : null,
    monsters: c.monsters,
  };
}

function gameDate(g) {
  return `${g.day}-${String(g.month).padStart(2, "0")}-`
       + `${String(g.year).padStart(4, "0")}`;
}

// Redrawing the whole tab every minute would fight with scrolling and
// typing, so the clock writes into its own element.
let clockTimer = null;
function startClock() {
  if (clockTimer) clearInterval(clockTimer);
  const tick = () => {
    const el = document.getElementById("gclock");
    const g = gameNow();
    if (!el || !g) { clearInterval(clockTimer); clockTimer = null; return; }
    el.textContent = `${gameDate(g)} \u00b7 ${g.h}:${String(g.m).padStart(2, "0")}`;
  };
  tick();
  clockTimer = setInterval(tick, 10000);
}

function go(tab, sub) {
  const want = "#" + tab + (sub ? "/" + encodeURIComponent(sub) : "");
  if (location.hash === want) applyRoute(); else location.hash = want;

function applyRoute() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ""));

  // market, which is the nearest thing to what it showed.
  tab = TABS.includes(t) ? t : (t === "profit" ? "market" : "home");
  focusBot = tab === "bots" && sub ? sub : null;
  focusPlayer = tab === "players" && sub ? sub : null;
  focusQuest = tab === "quests" && sub ? sub : null;
  focusGuild = tab === "guilds" && sub ? sub : null;
  focusBeast = tab === "fight" && sub ? sub : null;
  focusItem = tab === "market" && sub ? sub : null;
  sortKey = null;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));

}

/* price spread ------------------------------------------------------- */
function axis(it) {
  const all = [...it.sell, ...it.buy].map(l => l.price);
  if (all.length < 2) return "";
  const lo = Math.min(...all), hi = Math.max(...all);
  if (hi === lo) return "";
  const log = hi / Math.max(lo, 0.01) > 40;
  const at = p => {
    const f = log ? (Math.log(p) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))
                  : (p - lo) / (hi - lo);
    // hi and lo are equal when every price is the same, and the
    // fraction is then 0/0.
    return isFinite(f) ? (f * 100).toFixed(2) : "0.00";
  };
  const s = it.best.sell, b = it.best.buy;
  const gap = s && b && b.price > s.price
    ? `<div class="overlap" style="left:${at(s.price)}%;width:${
        at(b.price) - at(s.price)}%"></div>` : "";
  const pins = side => it[side].map(l =>
    `<div class="pin ${side[0]}" style="left:${at(l.price)}%" title="${
      esc(l.bot)} ${fmt(l.price)}"></div>`).join("");
  return `<div class="axis">
    <div class="track">${gap}${pins("sell")}${pins("buy")}</div>
    <div class="ends"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div>
    <div class="legend">
      <span class="swatch" style="background:var(--brass)"></span>on sale
      &nbsp;&nbsp;<span class="swatch" style="background:var(--patina)"></span>wanted
      ${log ? "&nbsp;&nbsp;log scale" : ""}</div>
  </div>`;
}

function detailRow(it, span) {
  const col = (rows, title, cls) => `
    <div><h3>${title} <span>${rows.length}</span></h3>
    ${rows.length ? `<table>${rows.map(l => `<tr>
      <td class="num ${cls}">${fmt(l.price)}</td>
      <td class="num sm">${qty(l.qty)}</td>
      <td>${botLink(l.bot)}</td>
      <td class="sm">${esc(l.loc)}</td></tr>`).join("")}</table>`
      : `<div class="sm">Nobody.</div>`}</div>`;
  const s = it.best.sell, b = it.best.buy;
  let verdict;
  if (s && b) {
    const d = b.price - s.price;
    verdict = d > 0
      ? `Buy at <b class="brass">${fmt(s.price)}</b> from ${botLink(s.bot)},
         sell at <b class="patina">${fmt(b.price)}</b> to ${botLink(b.bot)}
         — <b>${fmt(d)}</b> a unit.`
      : `Cheapest is <b class="brass">${fmt(s.price)}</b>, best buyer pays
         <b class="patina">${fmt(b.price)}</b>. No money in it.`;
    if (d > 0 && b.emu === 0)
      verdict += ` <span class="t-sea">${esc(b.bot)} has no EMU free,
        so it may not be able to take any.</span>`;
  } else if (s) { verdict = "On sale, nobody buying."; }
  else if (b)   { verdict = "Wanted, nobody selling."; }
  else          { verdict = "Nothing live."; }
  return `<tr class="detail"><td colspan="${span}"><div class="dwrap">
    <div class="verdict">${verdict}</div>
    ${axis(it)}
    <div class="cols">
      ${col(it.sell, "On sale", "brass")}
      ${col(it.buy, "Wanted", "patina")}
    </div></div></td></tr>`;
}

    `<th class="${c.num ? "num " : ""}${c.hide ? "hide-sm" : ""}" data-k="${
      c.k || ""}">${c.t}${sortKey === c.k && c.k
        ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")
    + "</tr></thead>";
}
function sortRows(rows, def) {
  const k = sortKey || def, dir = sortKey ? sortDir : 1;
  return rows.sort((a, b) => {
    const x = typeof k === "function" ? k(a) : a[k];
    const y = typeof k === "function" ? k(b) : b[k];
    if (typeof x === "string" || typeof y === "string")
      return dir * String(x ?? "").localeCompare(String(y ?? ""));
    return dir * ((x ?? -Infinity) < (y ?? -Infinity) ? 1 : -1);
  });
}
function wireSort() {
  document.querySelectorAll("th[data-k]").forEach(th => {
    if (!th.dataset.k) return;
    th.onclick = () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
      render();
    };
  });
}
function wireRows() {
  document.querySelectorAll("tr.item").forEach(tr => tr.onclick = () => {
    const id = +tr.dataset.id;
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    render();
  });
}
function matches(it, q) {
  if (!q) return true;
  if (it.name.toLowerCase().includes(q)) return true;
  return [...it.sell, ...it.buy].some(l =>
    l.bot.toLowerCase().includes(q) || (l.loc || "").toLowerCase().includes(q));
}

/* one item, everything ------------------------------------------------
   The market knows what an item costs, the wiki knows what drops it, the
   recipes know what it makes and what makes it, and the quest guide
   knows who wants it. Each of those already travels with the page, so
   the join happens here rather than in the data: it costs nothing to
   ship and is built once, the first time somebody opens an item.      */
const ikey = s => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "")
                           .replace(/s$/, "");

/* Place names that begin with the name of an item: a quest sending you
   to Emerald Valley is not a quest about emeralds. Map names are mostly
   two words, so the first two of a longer one count as a place too.   */
let PLACES = null;
function places() {
  if (PLACES) return PLACES;
  const out = new Set();
  const add = name => {
    if (!name) return;
    const low = String(name).toLowerCase().trim();
    if (low) out.add(low);
    const words = low.split(/\s+/);
    if (words.length > 2) out.add(words.slice(0, 2).join(" "));
  };
  (DATA.creatures || []).forEach(c => (c.places || []).forEach(pl => {
    add(pl.where); add(pl.region); }));
  (DATA.bots || []).forEach(b => {
    add(b.map); add(String(b.location || "").split(" - ")[0]); });
  PLACES = [...out];
  return PLACES;
}

/* A plain substring would have Bone matching Bonefish and Sword matching
   Swordsman, so the characters on either side have to be non-letters. */
function hasWord(hay, needle) {
  let at = 0;
  for (;;) {
    const i = hay.indexOf(needle, at);
    if (i < 0) return false;
    const before = i === 0 ? " " : hay[i - 1];
    const after = hay[i + needle.length] || " ";
    const clean = !/[a-z0-9]/.test(before) && !/[a-z0-9]/.test(after);
    // Something longer and place-shaped starting right here wins.
    const isPlace = clean && places().some(pl =>
      pl.length > needle.length && hay.startsWith(pl, i));
    if (clean && !isPlace) return true;
    at = i + 1;
  }
}

let IDX = null;
function itemIndex() {
  if (IDX) return IDX;
  const drops = {}, made = {}, uses = {}, inQuest = {};
  const push = (map, key, val) => {
    const k = ikey(key);
    if (k) (map[k] = map[k] || []).push(val);
  };
  (DATA.creatures || []).forEach(c => {
    (c.drops || []).forEach(d => push(drops, d.item,
      { who: c.name, n: d.n, rare: 0 }));
    (c.rare || []).forEach(d => push(drops, d.item,
      { who: c.name, n: d.n, rare: 1 }));
  });
  (DATA.recipes || []).forEach(r => {
    made[ikey(r.item)] = r;
    (r.ings || []).forEach(g => push(uses, g.n, { item: r.item, a: g.a }));
  });
  // Short names throw up too much noise to be worth matching on.
  const named = DATA.items.filter(i => i.name.length >= 5)
                          .map(i => [i.name.toLowerCase(), i.name]);
  // A quest's text is not all strings: a reward is {amount, what} and a
   // step is {n, text, sub}. Joining those gives "[object Object]" and
   // loses the steps, which is exactly where the items are named. So
   // every string anywhere inside the quest is collected instead, which
   // also survives the shape changing again.
  const allText = (v, out) => {
    if (v == null) return out;
    if (typeof v === "string") out.push(v);
    else if (Array.isArray(v)) v.forEach(x => allText(x, out));
    else if (typeof v === "object") Object.values(v).forEach(x => allText(x, out));
    return out;
  };
  (DATA.quests || []).forEach(qu => {
    const blob = allText(qu, []).join(" ").toLowerCase();
    named.forEach(([low, real]) => {
      if (hasWord(blob, low)) push(inQuest, real, qu.name);
    });
  });
  IDX = { drops, made, uses, inQuest };
  return IDX;
}

const itemByKey = name =>
  DATA.items.find(i => ikey(i.name) === ikey(name));

/* An icon for an item we only know the name of, which is how the craft
   tab and the drop lists refer to them. Built once; a name with no
   artwork gets an empty space the same size, so names stay lined up. */
let IMG_BY_NAME = null;
function nameIcon(name) {
  if (!IMG_BY_NAME) {
    IMG_BY_NAME = {};
    DATA.items.forEach(i => { if (i.img) IMG_BY_NAME[ikey(i.name)] = i.img; });
  }
  const file = IMG_BY_NAME[ikey(name)];
  return file
    ? `<img src="${m.imgBase}${file}" loading="lazy" alt="">`
    : `<span class="noimg"></span>`;
}

function itemLink(name) {
  const it = itemByKey(name);
  return it ? `<a href="#market/${encodeURIComponent(it.name)}">${
    esc(name)}</a>` : esc(name);
}

  count.textContent = `${it.sell.length + it.buy.length} offer${

    <div><h3>${title} <span>${rows.length}</span></h3>

  const dropBlock = !drops.length ? "" : `

        ? `<span class="evkind"><svg class="ic"><use href="#i-find"/></svg

  const madeBlock = !made ? "" : `
    <h2 class="group">How it is made</h2>
    <p class="note">${esc(made.skill)} level ${made.level}${
      made.nexus ? `, <b>${esc(made.nexus)} nexus ${made.nexusLvl}</b>` : ""}${
      made.exp ? `, ${fmt(made.exp)} experience` : ""}${
      made.makes > 1 ? `. One mix makes <b>${fmt(made.makes)}</b>` : ""}${
      made.vendor ? `. A vendor pays ${fmt(made.vendor)} each.` : "."}
      ${made.tool || made.food || made.knows ? `Needs ${[
        made.tool ? `a <b>${esc(made.tool)}</b>` : null,

    <table class="itab"><thead><tr><th class="num">Need</th>
      <th class="wide">Ingredient</th>
      <th class="num">At cheapest</th></tr></thead>
    <tbody>${(made.ings || []).map(g => {
      const sub = itemByKey(g.n);
      const line = sub && sub.best.sell ? sub.best.sell.price * g.a : null;
      return `<tr><td class="num sm">${g.a}</td>
      <td><div class="nm">${nameIcon(g.n)}<span>${itemLink(g.n)}</span></div></td>
      <td class="num ${line ? "brass" : "sm"}">${
        line ? fmt(line) : "no bot sells it"}</td></tr>`;
    }).join("")}</tbody></table>
    ${(() => {
      const cost = (made.ings || []).reduce((t, g) => {
        const sub = itemByKey(g.n);

      }, 0);

        return sub && sub.best.sell; });
      if (!cost) return "";
      // The cost above is for one mix, so what the mix is worth has to

      const take = b ? b.price * n : null;
      return `<p class="note">${known ? "" : "At least "}<b>${fmt(cost)}</b>

    })()}`;

  // A bar goes into dozens of things. Show enough to be useful and say
  // how many more there are rather than running down the page.
  const USES_SHOWN = 15;
  const sortedUses = uses.slice().sort((a, b2) =>
    a.item.localeCompare(b2.item));
  const usesBlock = !uses.length ? "" : `
    <h2 class="group">What it goes into <span class="count">${
      uses.length}</span></h2>

  view.innerHTML = `
    <div class="bothead withpic">
      <button class="back">All items</button>

      ? `Cheapest is <b class="brass">${fmt(s.price)}</b> from ${

             buying it.`
      : b ? `No bot is selling it. ${botLink(b.bot)} pays
             <b class="patina">${fmt(b.price)}</b>.`
      : "No bot is trading it right now."}</div>
    ${money}${dropBlock}${madeBlock}${usesBlock}${harvestBlock}${questBlock}
    ${nothing ? `<p class="note">Nothing else is known about this one:
      no creature on the wiki drops it, no recipe makes it, and no quest
      names it.</p>` : ""}`;
  view.querySelector(".back").onclick = () => go("market");
  wireBotLinks();
}

/* players -------------------------------------------------------------
   About a third of players have privacy mode on, so every table here is
   of players with public stats rather than of the game. Say so.         */
const PLAYERS = DATA.players || [];
const PUBLIC = PLAYERS.filter(p => !p.private);
const SKILLS = (DATA.skills || []).slice().sort((a, b) =>
  a === "Overall" ? -1 : b === "Overall" ? 1 : a.localeCompare(b));
/* Composite rankings. The official page has these and they are the ones
   people argue about. Combat and non-combat are split the way the game
   groups them; say so, since it is a judgement call at the edges.      */
const COMBAT = ["Attack", "Defense", "Defence", "Ranging", "Summoning",
                "Magic"];
const NONCOMBAT = ["Harvest", "Harvesting", "Alchemy", "Potion",
                   "Manufacture", "Manufacturing", "Crafting",
                   "Engineering", "Tailoring"];
const realSkills = p => Object.entries(p.stats)
  .filter(([n, v]) => v.k === "skill" && n !== "Overall");

const COMPOSITES = {
  "Combat total": {
    note: "Attack, Defense, Ranging, Summoning and Magic added together",
    of: p => {
      const v = realSkills(p).filter(([n]) => COMBAT.includes(n));
      return v.length ? v.reduce((t, [, x]) => t + x.v, 0) : null;
    },
  },
  "Non-combat total": {
    note: "the gathering and making skills added together",
    of: p => {
      const v = realSkills(p).filter(([n]) => NONCOMBAT.includes(n));
      return v.length ? v.reduce((t, [, x]) => t + x.v, 0) : null;
    },
  },
  "All skills total": {
    note: "every skill added together, Overall excluded",
    of: p => {
      const v = realSkills(p);
      return v.length ? v.reduce((t, [, x]) => t + x.v, 0) : null;
    },
  },
  "Jack of all trades": {
    note: "your lowest skill - rewards being well rounded rather than "
        + "specialised",
    of: p => {
      const v = realSkills(p);
      return v.length ? Math.min(...v.map(([, x]) => x.v)) : null;
    },
  },
};
const COMPOSITE_NAMES = Object.keys(COMPOSITES);

function statOf(p, key) {
  if (COMPOSITES[key]) return COMPOSITES[key].of(p);
  return p.stats[key] ? p.stats[key].v : null;
}

if (pickEl && SKILLS.length) {

// The leaderboard runs to several hundred names, so it opens short.
let summonersShown = 25;

/* fight ---------------------------------------------------------------
   Creature stats and drop tables from the wiki, with what the bots pay
   for each drop. The money figure is a ceiling, not an average: a drop
   written "0-35 Gold coins" is priced at 35, and rare drops are not
   counted towards it at all.                                         */

// Wiki figures arrive as text, sometimes with a unit: "26 seconds",
// "105/90". Sorting needs the number in front of it.
const num = v => {
  const m = /-?\d+(?:\.\d+)?/.exec(String(v == null ? "" : v));
  return m ? parseFloat(m[0]) : -1;
};

const beastBy = name => (DATA.creatures || []).find(c =>
  c.name.toLowerCase() === String(name || "").toLowerCase());

const KINDS = { animal: "Animals", monster: "Monsters",
                instance: "Instance", invance: "Invance",
                invasion: "Invasion", other: "Other" };

function beastMatches(c, q) {
  if (!q) return true;
  return [c.name, (c.kinds || []).join(" "),
          (c.places || []).map(p => p.where).join(" "),
          (c.instances || []).join(" "),
          (c.drops || []).map(d => d.item).join(" "),
          (c.rare || []).map(d => d.item).join(" ")]
    .join(" ").toLowerCase().includes(q);
}

/* An instance is a fixed set of creatures behind one door, which is

    }).join("")}
    ${nInst ? `<button class="pill${fkind === "_inst" ? " on" : ""}"
      data-fkind="_inst">By instance</button>` : ""}</div>`;
}

function wireFightPicker(view) {

/* An instance is six to eight people behind one door against five
   waves of whatever the game picks, so the question is never what a
   Blue Dragon is worth on its own. It is what is in there, how many,
   and whether the clear pays. The wiki's Instances page says all three;
   el_instances.py reads it. */
function countTop(text) {
  // "1-2" means at most two, "150" means 150.
  const last = String(text == null ? "" : text).split("-").pop();
  const n = parseInt(last.replace(/[^0-9]/g, ""), 10);
  return isFinite(n) ? n : 1;
}

function instanceWorth(inst) {
  /* The game picks one option per wave when the instance starts, so a
     clear is worth somewhere between the cheapest run of choices and
     the richest. Both are "at most", since a drop written 0-35 gold is
     counted at 35. */
  let low = 0, high = 0, known = false, more = false;
  (inst.waves || []).forEach(wave => {
    const each = wave.map(o => countTop(o.count) * (o.worth || 0));
    if (each.some(v => v > 0)) known = true;
    if (wave.some(o => o.more)) more = true;
    low += Math.min(...each);
    high += Math.max(...each);
  });
  return known ? { low, high, more } : null;
}

function instanceRares(inst) {
  const byName = new Map((DATA.creatures || []).map(c => [c.name, c]));
  const best = new Map();
  (inst.waves || []).forEach(wave => wave.forEach(o => {
    const c = byName.get(o.creature);
    (c && c.rare || []).forEach(d => {
      const was = best.get(d.item);
      if (!was || (d.most || 0) > (was.most || 0)) best.set(d.item, d);
    });
  }));
  return [...best.values()].sort((a, b) => (b.most || 0) - (a.most || 0));
}

function whoMayEnter(inst) {
  if (!inst.adFrom) return "";
  if (inst.adTo) return `${inst.adFrom}–${inst.adTo} a/d`;
  return `${inst.adFrom}+ a/d`;
}

function instanceMatches(inst, q) {
  if (!q) return true;
  return [inst.player, inst.name, inst.nick, inst.short,
          (inst.waves || []).flat().map(o => o.creature).join(" ")]
    .join(" ").toLowerCase().includes(q);
}

    ${all.map(inst => {

/* A creature that fights in an instance and in an invasion has a drop
   table for each, and they are not the same table: a Castellan killed
   in the Dungeon carries about 835,000 gold, and the same Castellan in
   an invasion about 340,000. Listing both as one run of rows read as
   one creature dropping everything twice. */
function killWorth(c) {
  return Math.max(c.worth || 0, c.worthInst || 0);
}

/* A figure with something unpriced inside it is a floor, not a total.
   The wiki records no amount at all for some gold drops - a Meltean's
   is written "??" - so those creatures are worth at least what is
   shown and nobody can say how much more. */
function worthText(value, more) {
  if (!value) return more ? "?" : "\u2013";
  return fmt(value) + (more ? "+" : "");
}

function dropGroups(drops) {
  const LABEL = { instance: "Drops in an instance",
                  invasion: "Drops in an invasion" };
  const kinds = [...new Set(drops.map(d => d.where || ""))];
  if (kinds.length < 2) return drops.length ? [["Drops", drops]] : [];
  return ["instance", "invasion", ""].filter(k => kinds.includes(k))
    .map(k => [LABEL[k] || "Drops", drops.filter(d => (d.where || "") === k)]);
}

/* guilds --------------------------------------------------------------
   Who is in which guild is published nowhere, so this comes from
   guild.txt, kept by hand. A guild page is the same rankings as the
   players tab, narrowed to one roster, which is the only way to see
   where someone stands among the people they actually play with.    */

/* What a day does, as a picture. The rules read the day's own
   description rather than its name, because the names say nothing: the
   Day of Aleksei Stakhanov is a harvesting day and the Day of Joule is
   a manufacturing one, and only the effect text tells you so. Order
   matters - eating is checked before fighting, or the Day of Bones
   would be a combat day on the strength of "creatures drop more". */
const DAY_ICONS = [
  // Weather first: an acid rain day destroys worn items, which would
  // otherwise read as a manufacturing day.
  [/acid rain|solar flare/, "warn"],
  [/ranging/, "bow"],
  [/summon/, "magic"],
  // "No book knowledge needed for harvesting, manufacturing, alchemy"
  // is about books, not any of the three skills it lists.
  [/book knowledge/, "book"],
  // Narrow: the Day of Fasting stops regeneration, which is a day
  // about not eating rather than a day about healing.
  [/healing|health restored/, "heart"],
  // The named skill beats the "4x at school" tacked on the end of it,
  // or every skill day would come out as a school day.
  [/tailor|manufactur|engineer/, "craft"],
  [/alchem|potion|\bmana\b/, "flask"],
  [/\bmagic\b/, "magic"],
  [/harvest/, "leaf"],
  // \b matters: without it "eat" is inside "creatures" and the Day of
  // Faster Respawns becomes a day about food. Food comes before books
  // because the Day of Fasting stops research as a side effect.
  [/\beat\b|\beating\b|\bfood\b|hunger|bones|mushroom|toadstool|fasting/,
   "food"],
  [/book|school|knowledge|read|scholar|scientist|research|print/, "book"],
  [/mixing|mix window|craft|ingredient|rare result|recycl|used items|break|destroyed/, "craft"],
  [/attack|defen[cs]e|combat|armour|armor|invasion|monster|animal|flee|fight|respawn|dies|drops|weapon|kill/, "fight"],
  [/cooldown|action point|twice as fast|faster|horses|beam|last longer/,
   "clock"],
];

function dayIcon(name, what, kind) {
  const text = `${name} ${what || ""}`.toLowerCase();
  for (const [re, id] of DAY_ICONS) {
    if (re.test(text)) return id;
  }
  if (kind === "bad") return "warn";
  return "days";
}

/* The league tables and the reference disagree on capitals - one says
   "Reconstruction day" and the other "Reconstruction Day" - so looking
   a day up by its exact name silently found nothing and drew the blank
   fallback icon. */
let DAY_BY_NAME = null;
function dayRefOf(name) {
  if (!DAY_BY_NAME) {
    DAY_BY_NAME = {};
    Object.entries(DATA.dayRef || {}).forEach(([k, v]) => {
      DAY_BY_NAME[k.toLowerCase()] = v;
    });
  }
  return DAY_BY_NAME[String(name || "").toLowerCase()] || {};
}

const dayMark = (name, v) => `<svg class="ic dayic k-${
  esc(v.kind || "unknown")}"><use href="#i-${
  dayIcon(name, v.what, v.kind)}"/></svg>`;

const guildTag = g => `<span class="gtag"${g.colour
  ? ` style="color:${esc(g.colour)};border-color:${esc(g.colour)}44"` : ""
  }>${esc(g.tag)}</span>`;

const guildBy = tag => (DATA.guilds || []).find(g =>
  g.tag.toLowerCase() === String(tag || "").toLowerCase());

// A roster is a list of names; the stats live with the players.
function guildMembers(g) {
  const want = new Map((g.members || []).map(n => [n.toLowerCase(), n]));
  const found = PLAYERS.filter(p => want.has(p.name.toLowerCase()));
  const seen = new Set(found.map(p => p.name.toLowerCase()));
  const missing = [...want.entries()].filter(([k]) => !seen.has(k))
                                     .map(([, n]) => n);
  return { found, missing };
}

function renderGuilds(view, count) {
  const gs = DATA.guilds || [];
  count.textContent = `${gs.length} guild${gs.length === 1 ? "" : "s"}`;
  if (!gs.length) {
    view.innerHTML = `<div class="empty">No guild is being followed yet.
      <br><span class="sm">Add one to <code>guild.txt</code>.</span></div>`;
    return;
  }
  view.innerHTML = `
    <div class="grouphint">Guild membership is not published anywhere we
      could find, so these rosters are kept by hand. To have a guild
      added, send its member list.</div>
    <div class="scroller"><table class="daylog"><thead><tr><th>Guild</th><th>Tag</th>
      <th class="stonecell">Members</th>
      <th class="stonecell">With stats</th></tr></thead>
    <tbody>${gs.map(g => {
      const { found } = guildMembers(g);
      const open = found.filter(p => !p.private).length;

        <td><a class="lnk glnk" href="#guilds/${encodeURIComponent(g.tag)}">${
          esc(g.name)}</a></td>
        <td>${guildTag(g)}</td>
        <td class="num">${fmt(g.members.length)}</td>
        <td class="num sm">${fmt(open)}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

function renderOneGuild(view, count, q) {
  const g = guildBy(focusGuild);
  if (!g) { count.textContent = ""; 
    view.innerHTML = `<div class="empty">No such guild.</div>`; return; }

  const { found, missing } = guildMembers(g);
  const open = found.filter(p => !p.private);
  const hidden = found.length - open.length;

  // Ranked by the chosen skill, or by overall when none is chosen.
  const key = gskill || "Overall";
  let rows = open
    .map(p => ({ p, lvl: statOf(p, key) }))
    .filter(x => x.lvl != null)
    .filter(x => !q || x.p.name.toLowerCase().includes(q))
    .sort((a, b) => b.lvl - a.lvl || a.p.name.localeCompare(b.p.name));

  count.textContent = `${esc(g.name)}, ${fmt(g.members.length)} members`;

  const picker = `<div class="pills">
    <button class="pill${gskill ? "" : " on"}" data-gskill="">Overall</button>
    ${SKILLS.filter(sk => sk !== "Overall").map(sk =>
      `<button class="pill${gskill === sk ? " on" : ""}"
        data-gskill="${esc(sk)}">${esc(sk)}</button>`).join("")}</div>`;

  // The guild's own total, which is the number a guild actually argues
  // about. Private members are not in it, so it is a floor.
  const total = open.reduce((a, p) => a + (statOf(p, key) || 0), 0);
  const best = rows[0];

  let rank = 0, last = null;
  view.innerHTML = `
    <div class="bothead">
      <button class="back">All guilds</button>
      <h2>${esc(g.name)}</h2>
      <span class="where">${guildTag(g).replace('class="gtag"',
        'class="gtag big"')}</span>
    </div>
    ${picker}
    <div class="grouphint">${fmt(open.length)} of ${fmt(g.members.length)}
      members have public stats${hidden ? `, ${fmt(hidden)} have privacy
      mode on` : ""}${missing.length ? `, ${fmt(missing.length)} have not
      been read yet` : ""}. Between them they hold
      <b>${fmt(total)}</b> ${esc(key.toLowerCase())}${best
        ? `, and ${playerLink(best.p.name)} leads on ${fmt(best.lvl)}` : ""}.
      Private members are left out, so that total is a floor.</div>
    ${rows.length ? `<div class="scroller"><table>
      <thead><tr><th class="num">#</th><th>Player</th>
        <th class="num">${esc(key)}</th>
        ${gskill ? `<th class="num hide-sm">Overall</th>` : ""}</tr></thead>
      <tbody>${rows.map(x => {
        if (x.lvl !== last) { rank = rows.indexOf(x) + 1; last = x.lvl; }
        return `<tr>
          <td class="num sm">${rank}</td>
          <td>${playerLink(x.p.name)}</td>
          <td class="num brass">${fmt(x.lvl)}</td>
          ${gskill ? `<td class="num sm hide-sm">${
            fmt(statOf(x.p, "Overall") || 0)}</td>` : ""}
        </tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty">Nobody in this guild has a public ${
          esc(key.toLowerCase())}.</div>`}
    ${missing.length ? `<div class="caveat">Not read yet: ${
      missing.slice(0, 12).map(esc).join(", ")}${
      missing.length > 12 ? ` and ${fmt(missing.length - 12)} more` : ""}.
      They are picked up on the next daily read.</div>` : ""}`;

  wirePlayerLinks();
  const back = view.querySelector(".back");
  if (back) back.onclick = () => go("guilds");
  view.querySelectorAll("[data-gskill]").forEach(b => b.onclick = () => {
    gskill = b.dataset.gskill; render();
  });
}

/* events --------------------------------------------------------------
   Mercator relays what the game broadcasts to everyone. Pears and jokers
   are found by players; invasions happen to places. The same column
   carries both, because that is how the broadcasts are written.       */

function renderEvents(view, count, q) {
  const t = DATA.eventTotals;
  const all = DATA.finders || [];

  // Five ways of being first at something. Each board is the same shape

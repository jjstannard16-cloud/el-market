<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL Headquarters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:  #0d1210;
    --panel:   #151c17;
    --raised:  #1b241d;
    --line:    #273227;
    --line-2:  #35422f;
    --ink:     #e6dfcb;
    --muted:   #8d8a76;
    --brass:   #d0a63c;
    --brass-d: #6b5420;
    --patina:  #6fa79b;
    --patina-d:#2c4a45;
    --rust:    #b4603f;
    --display: "Fraunces", Georgia, serif;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 400 15px/1.5 var(--ui);
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 22px; }
  .num, th.num { font-variant-numeric: tabular-nums; }

  /* masthead ------------------------------------------------------- */
  .mast { border-bottom: 1px solid var(--line); }
  .mast .wrap {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap; padding-top: 26px; padding-bottom: 18px;
  }
  .mark { font-family: var(--display); font-size: 34px; font-weight: 600;
          line-height: 1; letter-spacing: -.015em; color: var(--ink);
          text-decoration: none; display: inline-block; }
  .mark:hover em { color: var(--ink); }
  .mark em { font-style: normal; color: var(--brass); }
  .ledger { display: flex; gap: 26px; }
  .ledger div { text-align: right; }
  .ledger .n { font-family: var(--display); font-size: 19px; font-weight: 600;
               line-height: 1.1; font-variant-numeric: tabular-nums; }
  .ledger .k { font-size: 12px; color: var(--muted); }

  /* the floor ------------------------------------------------------ */
  .floor { border-bottom: 1px solid var(--line); background: var(--panel); }
  .floor .wrap { padding-top: 18px; padding-bottom: 20px; }
  .floor h2 { font-family: var(--display); font-weight: 400; font-size: 16px;
              margin: 0 0 12px; color: var(--muted); }
  .deals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .deal {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    background: var(--raised); border: 1px solid var(--line);
    border-left: 3px solid var(--brass); border-radius: 3px;
    padding: 13px 15px; cursor: pointer; color: inherit; font: inherit;
    width: 100%;
  }
  .deal:hover { border-color: var(--line-2); border-left-color: var(--brass); }
  .deal img { width: 30px; height: 30px; object-fit: contain; flex: none;
              image-rendering: pixelated; margin-top: 2px; }
  .deal > span { display: block; min-width: 0; }
  .deal .amt { display: block; font-family: var(--display); font-size: 22px;
               font-weight: 600; color: var(--brass); line-height: 1.1;
               font-variant-numeric: tabular-nums; }
  .deal .what { display: block; font-size: 13.5px; margin-top: 2px; }
  .deal .route { display: block; font-size: 12px; color: var(--muted);
                 margin-top: 3px; }
  .nodeals { color: var(--muted); font-size: 14px; padding: 2px 0 4px; }

  /* controls ------------------------------------------------------- */
  .bar { border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; gap: 18px;
               flex-wrap: wrap; padding-top: 0; }
  nav { display: flex; }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 13px 0; margin-right: 22px; cursor: pointer;
    font: 500 14.5px var(--ui);
  }
  nav button:hover { color: var(--ink); }
  nav button.on { color: var(--brass); border-bottom-color: var(--brass); }
  .spacer { flex: 1; }
  input[type=search] {
    width: 260px; padding: 7px 11px; border-radius: 3px;
    border: 1px solid var(--line-2); background: var(--ground);
    color: var(--ink); font: 400 14px var(--ui);
  }
  input[type=search]::placeholder { color: #6a6a5c; }
  .walk { display: none; gap: 7px; align-items: center; color: var(--muted);
          font-size: 13.5px; cursor: pointer; user-select: none; }
  .walk input { accent-color: var(--brass); }
  .modes { display: none; align-items: center; gap: 0; font-size: 13px; }
  .modes .lbl { color: var(--muted); margin-right: 10px; }
  .modes button {
    background: none; border: 1px solid var(--line-2); border-right: 0;
    color: var(--muted); padding: 5px 11px; cursor: pointer;
    font: 400 12.5px var(--ui);
  }
  .modes button:first-of-type { border-radius: 3px 0 0 3px; }
  .modes button:last-of-type { border-right: 1px solid var(--line-2);
                               border-radius: 0 3px 3px 0; }
  .modes button:hover { color: var(--ink); }
  .modes button.on { color: var(--ground); background: var(--brass);
                     border-color: var(--brass); }
  .gathered { color: var(--patina); }
  .pills { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 18px; }
  .pills .pill { background: none; border: 1px solid var(--line-2);
    color: var(--muted); padding: 5px 12px; border-radius: 3px;
    cursor: pointer; font: 400 12.5px var(--ui); }
  .pills .pill:hover { color: var(--ink); border-color: var(--brass); }
  .pills .pill.on { color: var(--ground); background: var(--brass);
                    border-color: var(--brass); }
  .evkind { font-family: var(--sans); font-size: 11px; letter-spacing: .03em;
            color: var(--muted); border: 1px solid var(--line-2);
            border-radius: 2px; padding: 1px 6px; white-space: nowrap; }
  .qnpc { font-size: 14.5px; margin: 2px 0 12px; }
  .qnpc b { color: var(--brass); font-weight: 500; }
  .coord { font-family: var(--mono, monospace); font-size: 12.5px;
           color: var(--muted); }
  .qintro { font-size: 14.5px; max-width: 70ch; color: var(--ink);
            margin: 0 0 14px; }
  .qblock { margin-bottom: 26px; }
  .qblock h3 { font-family: var(--display); font-weight: 400; font-size: 15px;
               margin: 0 0 8px; color: var(--ink); }
  ul.plain { margin: 0; padding-left: 18px; font-size: 13.5px; }
  ul.plain li { padding: 3px 0; }
  ol.steps { margin: 0; padding-left: 20px; font-size: 14px;
             max-width: 78ch; }
  ol.steps > li { padding: 5px 0; line-height: 1.55; }
  ol.sub { list-style: lower-alpha; margin: 6px 0 2px; padding-left: 20px;
           font-size: 13.5px; color: var(--muted); }
  /* The guide's tables are set in spaces and some are very wide, so the
     block scrolls on its own rather than stretching the page. */
  .qblock { min-width: 0; }
  pre.guide { font: 12px/1.5 var(--mono, ui-monospace, monospace);
    color: var(--ink); background: var(--panel, rgba(255,255,255,.02));
    border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px;
    overflow-x: auto; white-space: pre; max-width: 100%; }
  table.quests { table-layout: fixed; width: 100%; }
  table.quests td, table.quests th { overflow-wrap: anywhere; }
  @media (max-width: 620px) {
    /* Six columns do not fit a phone, so the dates go and the counts stay. */
    table.finders td:nth-child(n+5), table.finders th:nth-child(n+5) {
      display: none; }
    table.quests td:nth-child(4), table.quests th:nth-child(4) { display: none; }
    table.quests td:nth-child(3), table.quests th:nth-child(3) {
      font-size: 12px; }
    pre.guide { font-size: 10.5px; }
    ol.steps { padding-left: 16px; }
  }
  .pick { display: none; padding: 5px 9px; border-radius: 3px;
          border: 1px solid var(--line-2); background: var(--ground);
          color: var(--ink); font: 400 13px var(--ui); }
  .caveat { color: var(--muted); font-size: 12.5px; margin: -2px 0 12px; }
  .hidden-row td { color: var(--muted); }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { font-size: 11.5px; border: 1px solid var(--line-2);
          border-radius: 10px; padding: 1px 8px; color: var(--muted); }
  h2.group { font-family: var(--display); font-weight: 400; font-size: 15px;
             color: var(--muted); margin: 26px 0 12px;
             border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  h2.group:first-child { margin-top: 2px; }
  .today { border: 1px solid var(--line-2); border-left-width: 3px;
           border-radius: 3px; padding: 15px 18px; margin: 2px 0 6px;
           background: var(--panel); }
  .today .dayname { font-family: var(--display); font-size: 25px;
                    font-weight: 600; line-height: 1.1; }
  .today .daywhat { margin-top: 5px; font-size: 14px; max-width: 62ch; }
  .today .daywhen { margin-top: 7px; font-size: 12.5px; color: var(--muted); }
  .k-good     { border-left-color: var(--patina); }
  .k-good .dayname { color: var(--patina); }
  .k-bad      { border-left-color: var(--rust); }
  .k-bad .dayname  { color: var(--rust); }
  .k-mixed    { border-left-color: var(--brass); }
  .k-mixed .dayname { color: var(--brass); }
  .k-ordinary, .k-unknown { border-left-color: var(--line-2); }
  .k-ordinary .dayname, .k-unknown .dayname { color: var(--ink); }
  .daylog td:first-child { white-space: nowrap; }
  .daylog td { vertical-align: top; }
  .daydot { display: inline-block; width: 7px; height: 7px; border-radius: 4px;
            margin-right: 9px; vertical-align: 1px;
            background: var(--line-2); }
  .daydot.k-good { background: var(--patina); }
  .daydot.k-bad { background: var(--rust); }
  .daydot.k-mixed { background: var(--brass); }
  .stonecell { white-space: nowrap; text-align: right; }
  .daylog thead th { font-family: var(--sans); font-size: 11px;
    font-weight: 500; letter-spacing: .05em; color: var(--muted);
    text-align: left; padding-bottom: 6px; border-bottom: 1px solid var(--line);}
  .daylog thead th.stonecell { text-align: right; }
  .grouphint { font-size: 13.5px; color: var(--muted); margin: -6px 0 14px; }
  .seen { font-family: var(--sans); font-size: 11.5px; color: var(--muted);
          margin-top: 3px; }
  .rank { display: inline-block; min-width: 24px; color: var(--muted);
          font-size: 12px; font-variant-numeric: tabular-nums; }
  .rank.medal { color: var(--brass); font-weight: 600; }
  .more { font-family: var(--sans); font-size: 13px; color: var(--muted);
          background: none; border: 1px solid var(--line-2);
          border-radius: 3px; padding: 7px 14px; margin-top: 14px;
          cursor: pointer; }
  .more:hover { color: var(--ink); border-color: var(--brass); }
  .panelhint { font-family: var(--sans); font-size: 11.5px;
               color: var(--muted); margin: -8px 0 10px; }
  table.ranks td { padding: 5px 8px 5px 0; font-size: 13.5px; }
  table.ranks td:first-child { width: 45%; }
  .barcell { width: 40%; }
  .bar { display: block; height: 7px; background: var(--line);
         border-radius: 1px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brass);
           opacity: .55; }
  .years { margin-top: 26px; }
  @media (max-width: 620px) {
    .yearbars { height: 84px; gap: 3px; }
    .yb b { font-size: 9.5px; }
    .yb span { font-size: 9px; }
    table.ranks td:first-child { width: auto; }
    .barcell { display: none; }
  }
  .yearbars { display: flex; align-items: flex-end; gap: 6px; height: 110px;
              margin-top: 10px; }
  .yb { flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-end; height: 100%; }
  .ybstack { width: 100%; max-width: 46px; background: var(--brass);
             opacity: .62; border-radius: 2px 2px 0 0; min-height: 2px; }
  .yb.partial .ybstack { opacity: .3; }
  .yb b { font-family: var(--sans); font-size: 11px; font-weight: 500;
          color: var(--muted); margin-bottom: 4px;
          font-variant-numeric: tabular-nums; }
  .yb span { font-family: var(--sans); font-size: 10.5px;
             color: var(--muted); margin-top: 6px; }
  .stone { display: inline-block; font-size: 12.5px; color: var(--brass); }
  .stone.sm { color: var(--muted); }
  .gclock { font-variant-numeric: tabular-nums; color: var(--ink);
            letter-spacing: .02em; }
  .today .warning { font-family: var(--sans); font-size: 13px;
    color: var(--rust); margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--line); }
  .unsure { font-family: var(--sans); font-size: 11px; font-weight: 500;
            letter-spacing: .04em; color: var(--muted);
            border: 1px solid var(--line-2); border-radius: 2px;
            padding: 1px 5px; vertical-align: 2px; }
  .today a { color: inherit; text-decoration: underline;
             text-underline-offset: 3px; }
  .sections { display: grid; gap: 12px;
              grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .sec { display: block; padding: 15px 17px; border: 1px solid var(--line);
         border-radius: 3px; background: var(--panel); text-decoration: none;
         color: inherit; }
  .sec:hover { border-color: var(--line-2); }
  .sec .nm2 { display: block; font-family: var(--display); font-size: 18px;
              color: var(--brass); margin-bottom: 3px; }
  .sec .sm { display: block; line-height: 1.45; }
  .sec .tally2 { display: block; margin-top: 9px; font-size: 12.5px;
                 color: var(--muted); font-variant-numeric: tabular-nums; }
  .skillgrid { display: grid; gap: 26px 30px;
               grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
  .skillcol h3 { font-family: var(--display); font-weight: 400; font-size: 16px;
                 margin: 0 0 6px; color: var(--brass); }
  .skillcol table { font-size: 13.5px; }
  .skillcol td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); }
  .skillcol td:first-child { width: 2rem; }
  .skillcol td:last-child { text-align: right; padding-right: 0; }
  button.more { margin-top: 8px; background: none; border: 0; padding: 0;
                color: var(--muted); font: 400 12.5px var(--ui);
                cursor: pointer; border-bottom: 1px solid var(--line-2); }
  button.more:hover { color: var(--brass); border-bottom-color: var(--brass); }
  .gate { font-size: 11.5px; color: var(--rust); border: 1px solid #4e2e26;
          border-radius: 10px; padding: 1px 7px; white-space: nowrap; }
  .ing { display: grid; grid-template-columns: 2.4rem 1fr auto auto;
         gap: 4px 14px; align-items: baseline; font-size: 13.5px;
         max-width: 620px; }
  .ing .amt { color: var(--muted); text-align: right; }
  .ing .each, .ing .sub { text-align: right; font-variant-numeric: tabular-nums; }
  .ing .rule { grid-column: 1 / -1; border-top: 1px solid var(--line-2);
               margin: 5px 0 1px; }

  /* tables --------------------------------------------------------- */
  main .wrap { padding-top: 16px; padding-bottom: 56px; }
  .meta-line { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .scroller { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 7px 11px; color: var(--muted);
    font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--line-2);
    position: sticky; top: 0; background: var(--ground); cursor: pointer;
    white-space: nowrap;
  }
  th:hover { color: var(--ink); }
  th.num, td.num { text-align: right; }
  td { padding: 7px 11px; border-bottom: 1px solid var(--line);
       vertical-align: top; }
  tr.item { cursor: pointer; }
  tr.item:hover > td { background: var(--panel); }
  tr.item.open > td { background: var(--panel); }
  .nm { display: flex; align-items: center; gap: 10px; }
  .nm img { width: 20px; height: 20px; object-fit: contain; flex: none;
            image-rendering: pixelated; }
  .sm { color: var(--muted); font-size: 12.5px; }
  .brass { color: var(--brass); }
  .patina { color: var(--patina); }
  a.lnk { color: var(--ink); text-decoration: none;
          border-bottom: 1px solid var(--line-2); cursor: pointer; }
  a.lnk:hover { color: var(--brass); border-bottom-color: var(--brass); }

  .trip { font-size: 12px; white-space: nowrap; }
  .t-map  { color: var(--patina); }
  .t-cont { color: var(--ink); }
  .t-sea  { color: var(--rust); }

  /* expanded item -------------------------------------------------- */
  .detail > td { background: var(--panel); padding: 0;
                 border-bottom: 1px solid var(--line-2); }
  .dwrap { padding: 16px 14px 20px; }
  .verdict { font-size: 14px; margin-bottom: 16px; }
  .verdict b { font-weight: 600; }

  .axis { margin: 0 6px 20px; }
  .track { position: relative; height: 3px; background: var(--line);
           border-radius: 2px; }
  .overlap { position: absolute; top: 0; height: 3px; background: var(--patina-d); }
  .pin { position: absolute; width: 2px; border-radius: 1px;
         transform: translateX(-1px); }
  .pin.s { top: -7px; height: 17px; background: var(--brass); }
  .pin.b { top: -7px; height: 17px; background: var(--patina); }
  .ends { display: flex; justify-content: space-between; margin-top: 12px;
          font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .swatch { display: inline-block; width: 2px; height: 10px;
            vertical-align: -1px; margin-right: 5px; }

  .cols { display: flex; gap: 36px; align-items: flex-start; flex-wrap: wrap; }
  .cols > div { flex: 1 1 320px; min-width: 0; }
  .cols h3 { font-family: var(--display); font-weight: 400; font-size: 15px;
             margin: 0 0 7px; color: var(--ink); }
  .cols h3 span { color: var(--muted); font-size: 13px; font-family: var(--ui); }
  .cols table { font-size: 13.5px; }
  .nowrap { white-space: nowrap; }
  .seeall { display: inline-block; margin-top: 10px; font-family: var(--sans);
            font-size: 12.5px; color: var(--muted); text-decoration: none; }
  .seeall:hover { color: var(--brass); }
  .cols td { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); }

  /* bot page ------------------------------------------------------- */
  .bothead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
             margin: 2px 0 22px; }
  .bothead h2 { font-family: var(--display); font-weight: 600; font-size: 26px;
                margin: 0; }
  .bothead .where { color: var(--muted); font-size: 13.5px; }
  .back { background: none; border: 1px solid var(--line-2); color: var(--muted);
          padding: 5px 11px; border-radius: 3px; cursor: pointer;
          font: 400 13px var(--ui); }
  .back:hover { color: var(--ink); border-color: var(--muted); }

  .empty { padding: 56px 0; text-align: center; color: var(--muted); }
  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding-top: 20px; padding-bottom: 44px;
                 color: var(--muted); font-size: 12.5px; line-height: 1.65; }
  .footgrid { display: grid; gap: 18px 36px;
              grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .footgrid b { color: var(--ink); font-weight: 600; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace;
         background: var(--panel); padding: 1px 5px; border-radius: 2px;
         font-size: 12px; color: var(--ink); }
  a { color: var(--brass); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 860px) {
    .deals { grid-template-columns: 1fr; }
    .mast .wrap { padding-bottom: 14px; }
    .ledger { gap: 18px; }
    input[type=search] { width: 100%; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<div class="mast"><div class="wrap">
  <a class="mark" href="#home">EL <em>Headquarters</em></a>
  <div class="ledger" id="ledger"></div>
</div></div>

<div class="bar"><div class="wrap">
  <nav>
    <button class="on" data-tab="home">Home</button>
    <button data-tab="market">Market</button>
    <button data-tab="profit">Profit</button>
    <button data-tab="craft">Craft</button>
    <button data-tab="players">Players</button>
    <button data-tab="quests">Quests</button>
    <button data-tab="events">Events</button>
    <button data-tab="guilds">Guilds</button>
    <button data-tab="days">Days</button>
    <button data-tab="bots">Bots</button>
  </nav>
  <div class="spacer"></div>
  <label class="walk" id="walkwrap">
    <input type="checkbox" id="walk"> Hide boat trips</label>
  <span class="modes" id="viewwrap">
    <button data-pview="skills" class="on">Skills</button>
    <button data-pview="pk">PK</button>
    <button data-pview="movers">Level-ups</button>
    <button data-pview="online">Online</button>
  </span>
  <select id="skillpick" class="pick"></select>
  <span class="modes" id="modewrap">
    <span class="lbl">Gathered materials</span>
    <button data-mode="value" class="on">worth what bots pay</button>
    <button data-mode="free">free</button>
    <button data-mode="buy">bought, not gathered</button>
  </span>
  <span id="toolbar" style="display:contents">
    <input type="search" id="q" placeholder="Item, bot, map or player">
  </span>
</div></div>

<main><div class="wrap">
  <div class="meta-line" id="count"></div>
  <div id="view"></div>
</div></main>

<footer><div class="wrap" id="foot"></div></footer>

<script src="data.js"></script>
<script>
if (typeof DATA === "undefined") {
  document.getElementById("view").innerHTML =
    `<div class="empty">Could not load data.js.<br>
     <span class="sm">It must sit next to index.html. Rebuild with
     <code>python el_site.py</code>.</span></div>`;
  throw new Error("data.js missing");
}
const m = DATA.meta;
let tab = "market", sortKey = null, sortDir = 1, focusBot = null;
let walkableOnly = false;
const openIds = new Set();
const AUTO_OPEN_UPTO = 5;

const UNLIMITED = -1;
const cap = q => q === UNLIMITED ? Infinity : q;
const qty = q => q === UNLIMITED ? "no limit" : q.toLocaleString("en-GB");
const fmt = n => n == null ? "–" : n === Infinity ? "∞"
  : (Math.abs(n) >= 1000 ? Math.round(n).toLocaleString("en-GB")
                         : (+n.toFixed(2)).toLocaleString("en-GB"));
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* derived figures ---------------------------------------------------- */
for (const it of DATA.items) {
  const s = it.sell.filter(x => x.qty !== 0)[0] || null;
  const b = it.buy.filter(x => x.qty !== 0)[0] || null;
  it.best = { sell: s, buy: b };
  if (s && b && b.price > s.price) {
    it.unit = b.price - s.price;
    it.units = Math.min(cap(s.qty), cap(b.qty));
    it.total = it.units === Infinity ? Infinity : it.unit * it.units;
    it.trip = s.map && s.map === b.map ? "map"
            : s.cont && b.cont ? (s.cont === b.cont ? "cont" : "sea")
            : "unknown";
  } else { it.unit = it.units = it.total = 0; it.trip = null; }
}
const TRIP = {
  map:     { label: "same map",  cls: "t-map"  },
  cont:    { label: "a walk",    cls: "t-cont" },
  sea:     { label: "by boat",   cls: "t-sea"  },
  unknown: { label: "unknown",   cls: "sm"     },
};

const BOTS = {};
for (const b of DATA.bots) BOTS[b.name] = { info: b, sell: [], buy: [] };
for (const it of DATA.items)
  for (const side of ["sell", "buy"])
    for (const l of it[side])
      (BOTS[l.bot] ||= { info: { name: l.bot }, sell: [], buy: [] })[side]
        .push({ item: it, qty: l.qty, price: l.price });

const botLink = n => `<a class="lnk" data-bot="${esc(n)}">${esc(n)}</a>`;

/* crafting ------------------------------------------------------------
   An ingredient you gather is not free: if a bot buys it, using one costs
   you that sale. "value" prices gathered materials at what bots pay,
   which is the number that says whether crafting beats selling the raw
   materials. "free" ignores that, "buy" refuses to gather at all.        */
let craftMode = "value";
let pview = "skills", pskill = "", focusPlayer = null;   // "" = every skill
let focusQuest = null, qsection = "";                    // "" = every section
let findersShown = 25, eboard = "found";
let focusGuild = null, gskill = "";       // "" = the roster, not one skill
const PRICE = {};
for (const it of DATA.items) {
  const k = it.name.toLowerCase();
  PRICE[k] = {
    sell: (it.sell.filter(x => x.qty !== 0)[0] || {}).price ?? null,
    sellBot: (it.sell.filter(x => x.qty !== 0)[0] || {}).bot ?? null,
    buy: (it.buy.filter(x => x.qty !== 0)[0] || {}).price ?? null,
    buyBot: (it.buy.filter(x => x.qty !== 0)[0] || {}).bot ?? null,
  };
}
const HARVEST = DATA.harvestables || {};

function cost(r, mode) {
  let total = 0;
  const lines = [], missing = [], tools = [];
  let anyGathered = false, gate = 0;
  for (const g of r.ings) {
    const k = g.n.toLowerCase();
    const p = PRICE[k] || {};
    if (p.sell != null) {
      total += p.sell * g.a;
      lines.push({ ...g, each: p.sell, from: p.sellBot, how: "buy" });
    } else if (k in HARVEST && mode !== "buy") {
      anyGathered = true;
      const worth = mode === "value" ? (p.buy || 0) : 0;
      total += worth * g.a;
      const h = HARVEST[k] || {};
      lines.push({ ...g, each: worth, how: "gather",
                   lvl: h.lvl, tool: h.tool, nexus: h.nexus });
      if (h.nexus) gate = Math.max(gate, h.nexus);
      if (h.tool && !tools.includes(h.tool)) tools.push(h.tool);
    } else {
      missing.push(g.n);
      lines.push({ ...g, each: null, how: "none" });
    }
  }
  const p = PRICE[r.item.toLowerCase()] || {};
  let sells = p.buy, where = "bot", who = p.buyBot;
  if (sells == null && r.vendor != null) { sells = r.vendor; where = "vendor"; who = null; }
  if (sells == null) { sells = 0; where = "nobody"; }
  const profit = sells - total;
  return {
    cost: total, lines, missing, gathered: anyGathered,
    gate, tools, sells, where, who, profit,
    margin: total > 0 ? profit / total * 100 : null,
    perXp: r.exp > 0 ? -profit / r.exp : null,
  };
}
const icon = it => it.img
  ? `<img src="${m.imgBase}${it.img}" loading="lazy" alt="">` : `<img alt="">`;

/* masthead ----------------------------------------------------------- */
document.getElementById("ledger").innerHTML = [
  [m.botCount, "bots"], [m.itemCount, "items"], [m.listingCount, "offers"],
  ...(m.playerCount ? [[m.playerCount, "players"]] : []),
  ...(DATA.online ? [[DATA.online.n, "online"]] : []),
  [m.lastScrape ? new Date(m.lastScrape).toLocaleTimeString("en-GB",
     { hour: "2-digit", minute: "2-digit" }) : "–", "last read"],
].map(([n, k]) => `<div><div class="n">${
  typeof n === "number" ? n.toLocaleString("en-GB") : n
}</div><div class="k">${k}</div></div>`).join("");

document.getElementById("foot").innerHTML = `
  <div class="footgrid">
    <div>
      <b>EL Headquarters</b> collects what the trade bots are buying and
      selling, what everything costs to craft, and where players stand,
      and puts it in one place. Prices are read every hour.
    </div>
    <div>
      Prices from <a href="https://bots.el-services.net/">bots.el-services.net</a>.
      Recipes and harvestables from the
      <a href="https://el-wiki.holy-eternalland.de/">EL wiki</a>.
      Player stats from <a href="https://www.eternal-lands.com/">eternal-lands.com</a>.
      The in-game calendar and the record of every special day come from
      <a href="https://mercator.holy-eternalland.de/">Mercator</a>.
      Item artwork is from Eternal Lands, copied here so visiting this
      site costs them nothing. Thanks to everyone who maintains them.
    </div>
    <div>
      Prices last read ${m.lastScrape
        ? new Date(m.lastScrape).toLocaleString("en-GB",
            { day: "numeric", month: "short", hour: "2-digit",
              minute: "2-digit" })
        : "\u2013"}.
      ${m.privateCount ? `${m.privateCount} players have privacy mode on and
        are left out of the rankings.` : ""}
      <br>A community project, not affiliated with Eternal Lands.
      Spotted something wrong? Tell stann in game.
    </div>
  </div>`;

/* home ---------------------------------------------------------------
   What has changed since you last looked, then a way into each section.
   Everything on this page links somewhere.                             */
const SECTIONS = [
  { id: "market", name: "Market",
    what: "Every item, who sells it cheapest and who pays most",
    n: () => `${DATA.items.length} items` },
  { id: "profit", name: "Profit",
    what: "Buy from one bot, sell to another, and whether the walk is worth it",
    n: () => `${DATA.items.filter(i => i.total > 0).length} trades in profit` },
  { id: "craft", name: "Craft",
    what: "What a craft costs at today's prices, and what a level costs",
    n: () => `${DATA.meta.recipeCount} recipes` },
  { id: "players", name: "Players",
    what: "Skill rankings with real levels, PK records and level-ups",
    n: () => `${DATA.meta.playerCount} players` },
  { id: "quests", name: "Quests",
    what: "Every quest written up: who starts it, what it needs, what it pays",
    n: () => `${(DATA.quests || []).length} quests` },
  { id: "guilds", name: "Guilds",
    what: "Rosters, and how a guild's members rank against each other",
    n: () => {
      const g = DATA.guilds || [];
      return g.length === 1 ? `${g[0].name}, ${g[0].members.length} members`
                            : `${g.length} guilds`;
    } },
  { id: "events", name: "Events",
    what: "Who finds the pears and jokers, and where the invasions land",
    n: () => `${fmt((DATA.eventTotals || {}).all || 0)} broadcasts` },
  { id: "days", name: "Days",
    what: "What today's special day does, and every day the game can throw",
    n: () => `${Object.keys(DATA.dayRef || {}).length} special days` },
  { id: "bots", name: "Bots",
    what: "Every trade bot, where it stands and what room it has left",
    n: () => `${DATA.bots.length} bots` },
];

function bestDeals(n) {
  return DATA.items
    .filter(it => it.total > 0 && it.trip !== "sea")
    .sort((a, b) => (b.total === Infinity ? 1e15 : b.total)
                  - (a.total === Infinity ? 1e15 : a.total))
    .slice(0, n);
}

// A day lasts about six hours, and the only clock we can read is the one
// in the bot site's header. When that header stops moving, the honest
// thing is to say we cannot tell, not to print a date from last week.
function todayBanner() {
  const t = DATA.today;
  if (!t) return "";
  if (t.stale) return `<div class="today k-unknown">
    <div class="dayname">We cannot tell you what day it is</div>
    <div class="daywhat">Special days last about six hours. The clock we
      read, in the header of the bot site, has shown the same reading for
      ${Math.round(t.heldHours)} hours, so it is not keeping time. Type
      <b>#day</b> in game for the real answer.</div>
    <div class="daywhen">Everything below is still accurate: what each day
      does, and what it costs to start one yourself.</div>
  </div>`;
  // Mercator gives the month as a number and nobody publishes the names,
  // so the date is written the way the game writes it.
  const numeric = /^\d+$/.test(String(t.month || ""));
  const when = numeric
    ? `${t.day}-${t.month}-${String(t.year).padStart(4, "0")}`
    : [t.day ? ordinal(t.day) : null, t.month ? "of " + t.month : null,
       t.year != null ? "year " + String(t.year).padStart(4, "0") : null]
      .filter(Boolean).join(" ");
  const g = gameNow();
  return `<div class="today k-${esc(t.ticked ? t.kind : "unknown")}">
    <div class="dayname">${esc(t.special)}${
      t.ticked ? "" : ` <span class="unsure">unconfirmed</span>`}</div>
    ${t.what ? `<div class="daywhat">${esc(t.what)}</div>` : ""}
    ${g && !g.stale
      ? `<div class="daywhen"><span id="gclock" class="gclock">${
          gameDate(g)} \u00b7 ${g.h}:${String(g.m).padStart(2, "0")}</span>
         <span class="muted">game time, running</span></div>`
      : when ? `<div class="daywhen">${esc(when)}${
          t.ticked ? "" : ` \u2014 this is what the bot site header says, but
          we have not yet watched it change, so check with <b>#day</b> in
          game`}</div>` : ""}
    ${g && g.warning ? `<div class="warning">${esc(g.warning)}${
      g.monsters ? ` <span class="muted">${fmt(g.monsters)} monsters</span>`
      : ""}</div>` : ""}
  </div>`;
}

// A game day is six real hours and the clock runs 0:00 to 5:59, measured
// off fifteen years of announcements rather than assumed. So the page can
// run the clock on from the last reading; the hourly reading only has to
// correct for the server having been down.
const GAME_DAY_MINUTES = 360;
const REAL_MS_PER_GAME_MINUTE = 60000;

function gameNow() {
  const c = DATA.clock;
  if (!c) return null;
  const read = Date.parse(c.at);
  if (!read) return null;
  const elapsed = Math.floor((Date.now() - read) / REAL_MS_PER_GAME_MINUTE);
  // A reading much older than an hour means the scrape is not running,
  // and a clock that has drifted for days is worse than no clock.
  const stale = Date.now() - read > 3 * 3600 * 1000;
  let total = c.h * 60 + c.m + Math.max(0, elapsed);
  const rolled = Math.floor(total / GAME_DAY_MINUTES);
  total %= GAME_DAY_MINUTES;
  let day = (c.day || 1) + rolled, month = c.month || 1, year = c.year || 0;
  while (day > 30) { day -= 30; month += 1; }
  while (month > 12) { month -= 12; year += 1; }
  return {
    h: Math.floor(total / 60), m: total % 60, day, month, year, stale,
    readAt: read,
    // Shown only while it is still news: Mercator keeps the text up long
    // after the invasion, so the clock goes by when it first appeared.
    warning: (Date.now() - Date.parse(c.warnSince || c.at) < 25 * 60 * 1000)
      ? c.warning : null,
    monsters: c.monsters,
  };
}

function gameDate(g) {
  return `${g.day}-${String(g.month).padStart(2, "0")}-`
       + `${String(g.year).padStart(4, "0")}`;
}

// Redrawing the whole tab every minute would fight with scrolling and
// typing, so the clock writes into its own element.
let clockTimer = null;
function startClock() {
  if (clockTimer) clearInterval(clockTimer);
  const tick = () => {
    const el = document.getElementById("gclock");
    const g = gameNow();
    if (!el || !g) { clearInterval(clockTimer); clockTimer = null; return; }
    el.textContent = `${gameDate(g)} \u00b7 ${g.h}:${String(g.m).padStart(2, "0")}`;
  };
  tick();
  clockTimer = setInterval(tick, 10000);
}

// Mercator spells the days slightly differently from our own reference
// table ("Leonard's day" against "Leonard's Day"), so names are matched
// without case.
function kindOf(name) {
  const ref = DATA.dayRef || {};
  const hit = Object.keys(ref).find(k =>
    k.toLowerCase() === String(name || "").toLowerCase());
  return hit ? ref[hit].kind : "unknown";
}

// How often this day has actually turned up, and how much of that was
// players paying for it rather than the game.
function seenLine(v) {
  const s = v.seen;
  if (!s) return "";
  const bits = [`seen ${fmt(s.times)}\u00d7`];
  if (s.summoned) bits.push(`${fmt(s.summoned)} paid for`);
  return `<div class="seen">${bits.join(" \u00b7 ")}</div>`;
}

// Most good days can be started on demand with a stone, and most bad ones
// cleared with one. Only the ones a bot is actually selling get a price.
function stoneLine(v) {
  if (v.stonePrice) return `<span class="stone">${
    fmt(v.stonePrice.price)}</span><br><span class="sm">${
    botLink(v.stonePrice.bot)}</span>`;
  if (v.stone) return `<span class="sm">no bot has one</span>`;
  return "";
}
const ordinal = n => n + (["th","st","nd","rd"][
  (n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");

function renderHome(view, count) {
  count.textContent = "";
  const deals = bestDeals(3);
  const moves = (DATA.moves || []).slice(0, 8);
  const ups = (DATA.movers || []).slice(0, 8);
  const span = DATA.meta.moveSpanHours;

  const top = `<h2 class="group">Worth a trip right now</h2>` + (deals.length
    ? `<div class="deals">${deals.map(it => `
        <button class="deal" data-item="${esc(it.name)}">
          ${icon(it)}
          <span>
            <span class="amt">${fmt(it.total)}</span>
            <span class="what">${esc(it.name)}</span>
            <span class="route">${esc(it.best.sell.map || "?")} \u2192 ${
              esc(it.best.buy.map || "?")} &middot; ${
              it.units === Infinity ? "no limit" : qty(it.units)} to move</span>
          </span></button>`).join("")}</div>`
    : `<div class="caveat">No gaps worth walking for in this reading.</div>`);

  const movesPanel = `<div><h3>Prices that moved${
    span ? ` <span class="sm">in the last ${
      span < 24 ? span + " hours" : "day"}</span>` : ""}</h3>
    ${moves.length ? `<table>${moves.map(mv => `<tr>
      <td>${esc(mv.item)}</td>
      <td class="num sm">${fmt(mv.was)} \u2192 ${fmt(mv.now)}</td>
      <td class="num ${mv.pct > 0 ? "t-sea" : "patina"}">${
        mv.pct > 0 ? "+" : ""}${mv.pct.toFixed(0)}%</td></tr>`).join("")}</table>`
      : `<div class="caveat">Nothing has shifted by more than 1%.</div>`}</div>`;

  const upsPanel = `<div><h3>Levelled up <span class="sm">recently</span></h3>
    ${ups.length ? `<table>${ups.map(u => `<tr>
      <td>${playerLink(u.name)}</td><td>${esc(u.stat)}</td>
      <td class="num brass">${u.now}</td>
      <td class="num sm">${esc(u.at.slice(5))}</td></tr>`).join("")}</table>`
      : `<div class="caveat">No level-ups yet. They appear once players have
         been read on two different days.</div>`}</div>`;

  // The day-stone board belongs on the front page: it is the one ranking
  // here that measures what someone has given the server rather than what
  // they have taken out of it.
  const stones = (DATA.summoners || []).slice(0, 10);
  const stonesPanel = !stones.length ? "" : `<div>
    <h3>Most day stones used <span class="sm">all time</span></h3>
    <table>${stones.map((pl, i) => `<tr>
      <td class="nowrap"><span class="rank${i < 3 ? " medal" : ""}">${
        i + 1}</span>${playerLink(pl.name)}</td>
      <td class="num brass">${fmt(pl.n)}</td>
    </tr>`).join("")}</table>
    <a class="seeall" href="#days">All ${
      fmt((DATA.summoners || []).length)} of them \u2192</a></div>`;

  view.innerHTML = todayBanner() + top
    + `<div class="cols" style="margin-top:26px">${movesPanel}${upsPanel}${
        stonesPanel}</div>`
    + `<h2 class="group">Everything here</h2>
       <div class="sections">${SECTIONS.map(sec => `
         <a class="sec" href="#${sec.id}">
           <span class="nm2">${sec.name}</span>
           <span class="sm">${sec.what}</span>
           <span class="tally2">${sec.n()}</span></a>`).join("")}</div>`;

  view.querySelectorAll(".deal").forEach(btn => btn.onclick = () => {
    document.getElementById("q").value = btn.dataset.item;
    go("profit");
  });
  wirePlayerLinks();
}

/* navigation ----------------------------------------------------------
   The address bar carries where you are, so a page can be pasted into
   game chat: #craft, #players/stann, #bots/Keruma.                     */
const TABS = ["home", "market", "profit", "craft", "players", "quests",
              "events", "guilds", "days", "bots"];

function go(tab, sub) {
  const want = "#" + tab + (sub ? "/" + encodeURIComponent(sub) : "");
  if (location.hash === want) applyRoute(); else location.hash = want;
}

function applyRoute() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  const [t, ...rest] = raw.split("/");
  const sub = rest.join("/");
  tab = TABS.includes(t) ? t : "home";
  focusBot = tab === "bots" && sub ? sub : null;
  focusPlayer = tab === "players" && sub ? sub : null;
  focusQuest = tab === "quests" && sub ? sub : null;
  focusGuild = tab === "guilds" && sub ? sub : null;
  sortKey = null;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo({ top: 0 });
  render();
}

const setTab = t => go(t);
window.addEventListener("hashchange", applyRoute);

document.querySelectorAll("nav button").forEach(btn =>
  btn.onclick = () => {
    document.getElementById("q").value = "";
    go(btn.dataset.tab);
  });
document.getElementById("q").oninput = () => {
  focusBot = null; focusPlayer = null; focusQuest = null;
  focusGuild = null; render();
};
document.getElementById("walk").onchange = e => {
  walkableOnly = e.target.checked; render();
};
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".modes button").forEach(x =>
    x.classList.remove("on"));
  b.classList.add("on"); craftMode = b.dataset.mode; render();
});

function openBot(name) { go("bots", name); }

const wireBotLinks = () =>
  document.querySelectorAll("a.lnk[data-bot]").forEach(a =>
    a.onclick = e => { e.stopPropagation(); openBot(a.dataset.bot); });

/* price spread ------------------------------------------------------- */
function axis(it) {
  const all = [...it.sell, ...it.buy].map(l => l.price);
  if (all.length < 2) return "";
  const lo = Math.min(...all), hi = Math.max(...all);
  if (hi === lo) return "";
  const log = hi / Math.max(lo, 0.01) > 40;
  const at = p => {
    const f = log ? (Math.log(p) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))
                  : (p - lo) / (hi - lo);
    return (f * 100).toFixed(2);
  };
  const s = it.best.sell, b = it.best.buy;
  const gap = s && b && b.price > s.price
    ? `<div class="overlap" style="left:${at(s.price)}%;width:${
        at(b.price) - at(s.price)}%"></div>` : "";
  const pins = side => it[side].map(l =>
    `<div class="pin ${side[0]}" style="left:${at(l.price)}%" title="${
      esc(l.bot)} ${fmt(l.price)}"></div>`).join("");
  return `<div class="axis">
    <div class="track">${gap}${pins("sell")}${pins("buy")}</div>
    <div class="ends"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div>
    <div class="legend">
      <span class="swatch" style="background:var(--brass)"></span>on sale
      &nbsp;&nbsp;<span class="swatch" style="background:var(--patina)"></span>wanted
      ${log ? "&nbsp;&nbsp;log scale" : ""}</div>
  </div>`;
}

function detailRow(it, span) {
  const col = (rows, title, cls) => `
    <div><h3>${title} <span>${rows.length}</span></h3>
    ${rows.length ? `<table>${rows.map(l => `<tr>
      <td class="num ${cls}">${fmt(l.price)}</td>
      <td class="num sm">${qty(l.qty)}</td>
      <td>${botLink(l.bot)}</td>
      <td class="sm">${esc(l.loc)}</td></tr>`).join("")}</table>`
      : `<div class="sm">Nobody.</div>`}</div>`;
  const s = it.best.sell, b = it.best.buy;
  let verdict;
  if (s && b) {
    const d = b.price - s.price;
    verdict = d > 0
      ? `Buy at <b class="brass">${fmt(s.price)}</b> from ${botLink(s.bot)},
         sell at <b class="patina">${fmt(b.price)}</b> to ${botLink(b.bot)}
         — <b>${fmt(d)}</b> a unit${it.units === Infinity
           ? ", and the buyer takes any amount."
           : `, <b>${fmt(it.total)}</b> across ${qty(it.units)}.`}`
      : `Cheapest is <b class="brass">${fmt(s.price)}</b>, best buyer pays
         <b class="patina">${fmt(b.price)}</b>. No money in it.`;
    if (d > 0 && b.emu === 0)
      verdict += ` <span class="t-sea">${esc(b.bot)} has no EMU free,
        so it may not be able to take any.</span>`;
  } else if (s) { verdict = "On sale, nobody buying."; }
  else if (b)   { verdict = "Wanted, nobody selling."; }
  else          { verdict = "Nothing live."; }
  return `<tr class="detail"><td colspan="${span}"><div class="dwrap">
    <div class="verdict">${verdict}</div>
    ${axis(it)}
    <div class="cols">
      ${col(it.sell, "On sale", "brass")}
      ${col(it.buy, "Wanted", "patina")}
    </div></div></td></tr>`;
}

const isOpen = (it, n, q) => openIds.has(it.id) || (q && n <= AUTO_OPEN_UPTO);

/* rendering ---------------------------------------------------------- */
function head(cols) {
  return "<thead><tr>" + cols.map(c =>
    `<th class="${c.num ? "num " : ""}${c.hide ? "hide-sm" : ""}" data-k="${
      c.k || ""}">${c.t}${sortKey === c.k && c.k
        ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")
    + "</tr></thead>";
}
function sortRows(rows, def) {
  const k = sortKey || def, dir = sortKey ? sortDir : 1;
  return rows.sort((a, b) => {
    const x = typeof k === "function" ? k(a) : a[k];
    const y = typeof k === "function" ? k(b) : b[k];
    if (typeof x === "string" || typeof y === "string")
      return dir * String(x ?? "").localeCompare(String(y ?? ""));
    return dir * ((x ?? -Infinity) < (y ?? -Infinity) ? 1 : -1);
  });
}
function wireSort() {
  document.querySelectorAll("th[data-k]").forEach(th => {
    if (!th.dataset.k) return;
    th.onclick = () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
      render();
    };
  });
}
function wireRows() {
  document.querySelectorAll("tr.item").forEach(tr => tr.onclick = () => {
    const id = +tr.dataset.id;
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    render();
  });
}
function matches(it, q) {
  if (!q) return true;
  if (it.name.toLowerCase().includes(q)) return true;
  return [...it.sell, ...it.buy].some(l =>
    l.bot.toLowerCase().includes(q) || (l.loc || "").toLowerCase().includes(q));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const view = document.getElementById("view");
  const count = document.getElementById("count");
  document.getElementById("toolbar").style.visibility =
    tab === "home" ? "hidden" : "visible";
  document.getElementById("walkwrap").style.display =
    tab === "profit" ? "flex" : "none";
  document.getElementById("modewrap").style.display =
    tab === "craft" ? "flex" : "none";
  document.getElementById("viewwrap").style.display =
    tab === "players" && !focusPlayer ? "flex" : "none";
  document.getElementById("skillpick").style.display =
    tab === "players" && !focusPlayer && pview === "skills"
      ? "inline-block" : "none";

  if (tab === "bots" && focusBot) return renderBot(view, count);
  if (tab === "bots")   return renderBotList(view, count, q);
  if (tab === "home")   return renderHome(view, count);
  if (tab === "guilds") return focusGuild
    ? renderOneGuild(view, count, q) : renderGuilds(view, count);
  if (tab === "events") return renderEvents(view, count, q);
  if (tab === "quests" && focusQuest) return renderOneQuest(view, count);
  if (tab === "quests") return renderQuests(view, count, q);
  if (tab === "days")   return renderDays(view, count, q);
  if (tab === "craft")  return renderCraft(view, count, q);
  if (tab === "players") return renderPlayers(view, count, q);

  let items = DATA.items.filter(it => matches(it, q));
  if (tab === "profit") {
    items = items.filter(it => it.total > 0);
    if (walkableOnly) items = items.filter(it => it.trip !== "sea");
  }
  if (!items.length) {
    count.textContent = "";
    view.innerHTML = `<div class="empty">${q
      ? "Nothing matches that."
      : "No trades in profit right now."}</div>`;
    return;
  }
  return tab === "profit" ? renderProfit(view, count, items, q)
                          : renderMarket(view, count, items, q);
}

function renderMarket(view, count, items, q) {

function renderProfit(view, count, items, q) {

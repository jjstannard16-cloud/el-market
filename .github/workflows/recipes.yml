name: Refresh recipes

# Recipes and harvestables change when the game updates, not hourly.
# Weekly is plenty, and it can be run by hand after a game patch.
on:
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape          # shares the group with the market scrape
  cancel-in-progress: false

jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pillow

      - name: Read the wiki
        run: python el_recipes.py import

      # What each rank of worship wants, which the quest guide leaves out.
      - name: Read the god rank tables
        run: python el_gods.py
        continue-on-error: true

      # Creature stats and drop tables, which the market prices join on.
      - name: Read the creatures
        run: python el_creatures.py
        continue-on-error: true

      # What is in each instance, wave by wave. Reads creatures.json to
      # check the names, so it runs after the creatures.
      - name: Read the instances
        run: python el_instances.py
        continue-on-error: true

      # Any item we have never seen before needs its icon copying over,
      # so the page never asks bots.el-services.net for one.
      - name: Fetch any new item artwork
        run: python el_images.py

      # Creatures had no picture at all. This finds one on the wiki for
      # as many as it can and shrinks it; a creature already done is
      # skipped, so only a new creature costs anything.
      - name: Fetch any new creature artwork
        run: python el_creature_images.py
        continue-on-error: true

      # The player pages list achievements as bare words; the wiki has
      # a badge for each, and a separate one per tier.
      - name: Fetch any new achievement badges
        run: python el_badges.py
        continue-on-error: true

      # The quest guide names who a quest starts with; the wiki has a
      # portrait for nearly all of them.
      - name: Fetch any new NPC portraits
        run: python el_npc_images.py
        continue-on-error: true

      - name: Rebuild the page
        run: python el_site.py --out public/index.html

      - name: Save
        run: |
          git config user.name  "el-market"
          git config user.email "actions@users.noreply.github.com"

          # el_bots.db is binary, so git cannot merge two versions of it.
          # If the remote moved while this job ran, throw our copy away,
          # take theirs, and redo the work on top. Both jobs are
          # idempotent, so redoing is always safe and always correct.
          for attempt in 1 2 3 4 5; do
            git add el_bots.db gods.json creatures.json instances.json \
                    creature_images.json badges.json npc_images.json \
                    public/index.html \
                    public/data.js public/img
            if git diff --staged --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "Recipe refresh $(date -u '+%Y-%m-%d')"
            if git push; then
              exit 0
            fi
            sleep $(( RANDOM % 20 + 5 ))
            echo "Remote moved. Redoing this run on top of it (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            python el_recipes.py import
            python el_gods.py || true
            python el_creatures.py || true
            python el_instances.py || true
            python el_creature_images.py || true
            python el_badges.py || true
            python el_npc_images.py || true
            python el_site.py --out public/index.html
          done
          echo "Could not land the change after 5 attempts."
          exit 1

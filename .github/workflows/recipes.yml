name: Refresh recipes

# Recipes and harvestables change when the game updates, not hourly.
# Weekly is plenty, and it can be run by hand after a game patch.
on:
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape          # shares the group with the market scrape
  cancel-in-progress: false

jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Read the wiki
        run: python el_recipes.py import

      - name: Rebuild the page
        run: python el_site.py --out public/index.html

      - name: Save
        run: |
          git config user.name  "el-market"
          git config user.email "actions@users.noreply.github.com"
          git add el_bots.db public/index.html
          if git diff --staged --quiet; then
            echo "Recipes unchanged."
            exit 0
          fi
          git commit -m "Recipe refresh $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash
          git push

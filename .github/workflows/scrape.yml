name: Scrape the market

# Hourly at :37 rather than :00 — GitHub's scheduler is busiest on the hour
# and runs get delayed. You can also start one by hand from the Actions tab.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two scrapes run at once; they would fight over the same commit.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Read every bot
        run: python el_bots.py scrape

      # Any item we have never seen before needs its icon copying over,
      # so the page never asks bots.el-services.net for one.
      - name: Fetch any new item artwork
        run: python el_images.py

      - name: Rebuild the page
        run: python el_site.py --out public/index.html

      - name: Save
        run: |
          git config user.name  "el-market"
          git config user.email "actions@users.noreply.github.com"

          # el_bots.db is binary, so git cannot merge two versions of it.
          # If the remote moved while this job ran, throw our copy away,
          # take theirs, and redo the work on top. Both jobs are
          # idempotent, so redoing is always safe and always correct.
          for attempt in 1 2 3 4 5; do
            git add el_bots.db public/index.html public/data.js public/img
            if git diff --staged --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "Market reading $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push; then
              exit 0
            fi
            sleep $(( RANDOM % 20 + 5 ))
            echo "Remote moved. Redoing this run on top of it (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            python el_bots.py scrape
            python el_site.py --out public/index.html
          done
          echo "Could not land the change after 5 attempts."
          exit 1
